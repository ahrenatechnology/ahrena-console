/* Layout: índice fixo à esquerda e, à direita, cada tela num quadro do tamanho real, com o que veio do CCAM embaixo. */
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: var(--text-md); line-height: 1.5; }

/* ---------- página ---------- */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));

.topo .dir { margin-left: auto; display: flex; gap: 6px; }

.seg button, .seg span { font: inherit; font-size: var(--text-xs); color: var(--muted); background: none; border: 0; padding: 4px 10px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

.pagina { display: grid; grid-template-columns: 230px minmax(0, 1fr); }

main { min-width: 0; padding-block: 24px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.tela { margin: 0 0 56px; scroll-margin-top: 70px; }

.tela h3 { margin: 2px 0 2px; font-size: var(--text-lg); font-weight: 600; text-wrap: balance; }

.c-blocked { color: var(--status-waiting-text); } .c-idle { color: var(--muted); }
.c-error { color: var(--status-error-text); } .c-abandoned { color: var(--status-abandoned-text); } .c-muted { color: var(--muted); } .c-accent { color: var(--accent-text); }

/* detalhe */

// Uma janela em duas bothWidths: 1100 (a do app) e 1440. O conteúdo é o mesmo; muda quantas colunas cabem.
const bothWidths = (fn, ws) => [1100, 1440].map(w => `<div class="width-col"><div class="rotulo">${w} px</div>${fn(w)}</div>`).join('')
const frameAt = (w, active, body, ws = 'ok') => `<div class="cc w${w}">${lado(active, 3, ws)}<div class="cc-main">${body}</div></div>`
const wave = (seed, n, base, amp) => Array.from({ length: n }, (_, i) => Math.max(0, base + amp * Math.sin(seed + i * 0.31) * Math.cos(seed * 0.7 + i * 0.09) + amp * 0.35 * Math.sin(i * 1.3 + seed)))
function tmSeries(series, { max, limit, h = 120 } = {}) {
  const W = 600, y = v => (h - 4 - v / max * (h - 14)).toFixed(1)
  const grid = [0.25, 0.5, 0.75, 1].map(f => `<line x1="0" x2="${W}" y1="${y(f * max)}" y2="${y(f * max)}" stroke="var(--border)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('')
  const limitLine = limit != null ? `<line x1="0" x2="${W}" y1="${y(limit)}" y2="${y(limit)}" stroke="var(--status-error-dot)" stroke-dasharray="5 4" stroke-width="1.2" vector-effect="non-scaling-stroke"/>` : ''
  const lines = series.map(([v, cor]) => `<polyline points="${v.map((n, i) => `${(i * W / (v.length - 1)).toFixed(1)},${y(n)}`).join(' ')}" fill="none" stroke="${cor}" stroke-width="1.7" vector-effect="non-scaling-stroke"/>`).join('')
  return `<svg class="tm-serie" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" aria-hidden="true">${grid}${limitLine}${lines}</svg>`
}
const tmAxis = h => `<div class="tm-axis">${h === 12 ? '<span>−12 h</span><span>−9 h</span><span>−6 h</span><span>−3 h</span>' : '<span>−60 min</span><span>−45</span><span>−30</span><span>−15</span>'}<span>agora</span></div>`
const tmColor = pct => pct >= 90 ? 'var(--status-error-dot)' : pct >= 80 ? 'var(--status-waiting-dot)' : 'var(--accent)'
const tmMeter = (label, used, total, unit, extra = '') => {
  const pct = Math.round(used / total * 100)
  return `<div class="tm-meter"><div class="top"><b class="mono" style="font-weight:500">${label}</b><span>${String(used).replace('.', ',')} de ${total} ${unit} · ${pct}%${extra}</span></div>${barra(pct, tmColor(pct))}</div>`
}
const tmAlerts = l => `<div class="tm-alerts">${l.map(([level, t, s, h]) => `<div><span class="ic c-${level}">${ic(level === 'error' ? 'x-circle' : level === 'waiting' ? 'alert-triangle' : level === 'completed' ? 'check-circle-2' : 'info')}</span><div>${t}${s ? `<small>${s}</small>` : ''}</div>${h ? `<span class="t">${h}</span>` : ''}</div>`).join('')}</div>`
const tmPortStates = { up: ['completed', 'Respondendo'], idle: ['abandoned', 'Ninguém escuta lá'], busy: ['waiting', 'Ocupada no Mac'], down: ['error', 'Fora do túnel'] }
const tmPort = st => `<span class="badge b-${tmPortStates[st][0]}"><span class="p"></span>${tmPortStates[st][1]}</span>`
const tmListen = t => t === 'todas' ? '<span class="pill b-waiting">todas as interfaces</span>' : '<span class="pill b-abandoned">só loopback</span>'
const hourToggle = `<div class="seg"><span class="on">1 h</span><span>12 h</span></div>`
const statCols = w => `grid-template-columns:repeat(${w === 1100 ? 3 : 6},minmax(0,1fr))`
const gridCols = w => `grid-template-columns:repeat(${w === 1100 ? 2 : 3},minmax(0,1fr))`
const spanAt = (w, n1100, n1440) => `grid-column:span ${w === 1100 ? n1100 : n1440}`

// A barra do tempo: um Svg com largura e altura explícitas, como o mod exige.
function grBarra(cols, T, ini, fim, st, marcas) {
  const w = Math.round(cols * CH), h = 12, x = v => Math.round(v / T * (w - 2)) + 1
  const ate = fim ?? T
  const cor = `var(--status-${st}-dot)`
  const fundo = `<rect x="0" y="5" width="${w}" height="2" rx="1" fill="var(--border)"/>`
  if (marcas) return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${fundo}<rect x="${x(ini)}" y="2" width="${Math.max(3, x(ate) - x(ini))}" height="8" rx="2" fill="${cor}" opacity=".28"/>${marcas.map(m => `<rect x="${x(m)}" y="2" width="2" height="8" fill="${cor}"/>`).join('')}</svg>`
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${fundo}<rect x="${x(ini)}" y="2" width="${Math.max(3, x(ate) - x(ini))}" height="8" rx="2" fill="${cor}"/>${fim == null ? `<rect x="${x(ate) - 2}" y="0" width="2" height="12" fill="${cor}"/>` : ''}</svg>`
}
// A régua em cima das barras: 0 à esquerda, o tempo da sessão à direita, "agora" no fim.
function grRegua(cols, T, largo) {
  const w = Math.round(cols * CH)
  const passo = T < 30 ? 5 : 10
  const marcas = Array.from({ length: Math.floor(T / passo) + 1 }, (_, i) => i * passo).filter(m => m === 0 || m <= T - passo / 2)
  return `<svg width="${w}" height="14" viewBox="0 0 ${w} 14">${marcas.map(m => { const x = Math.round(m / T * (w - 2)) + 1; return `<rect x="${x}" y="9" width="1" height="5" fill="var(--muted)"/><text x="${m === 0 ? 0 : x - 3}" y="8" font-size="9.5" fill="var(--muted)" font-family="var(--font-mono)">${m}′</text>` }).join('')}
    <rect x="${w - 1}" y="9" width="1" height="5" fill="var(--muted)"/><text x="${w}" y="8" text-anchor="end" font-size="9.5" fill="var(--muted)" font-family="var(--font-mono)">${T}′</text></svg>`
}
// O trilho à esquerda (quem disparou quem): ├ e ╰ por nível, │ quando o pai ainda tem irmãos abaixo.
function grTrilho(l, i) {
  const nivel = l[i].n[0]
  const temIrmaoAbaixo = niv => { for (let j = i + 1; j < l.length; j++) { if (l[j].k !== 'no' || l[j].n[0] < niv) return false; if (l[j].n[0] === niv) return true } return false }
  let s = ''
  for (let v = 1; v < nivel; v++) s += temIrmaoAbaixo(v) ? '│ ' : '  '
  return s + (temIrmaoAbaixo(nivel) ? '├' : '╰')
}
const grCont = c => ['active', 'error', 'completed'].filter(st => c[st]).map(st => `<span class="c-${st}">${c[st]} ${ST[st].g}</span>`).join(' ')
const grEstado = { active: 'ativo', completed: 'concluído', error: 'com erro' }

function grafo(nome, largo) {
  const d = GR[nome]
  const T = d.tempo
  const C = largo ? { nome: 40, barra: 36 } : { nome: 16, barra: 7 }
  const grid = largo ? `grid-template-columns:${C.nome}ch ${C.barra}ch 9ch 6ch 7ch` : `grid-template-columns:${C.nome}ch ${C.barra}ch 6ch`
  const lin = (a, b, c3, c4, c5, cls = '') => `<div class="gr-ln ${cls}" style="${grid}">${a}<span>${b}</span>${largo ? `<span class="mut">${c3 ?? ''}</span><span class="mut">${c4 ?? ''}</span>` : ''}<span class="mut gr-d">${c5 ?? ''}</span></div>`
  const linhas = largo || nome === 'simples' ? d.linhas : d.linhas.slice(0, 9)
  const rows = [
    lin(`<span class="mut gr-cab">${largo ? 'quem disparou quem' : 'quem disparou'}</span>`, largo ? grRegua(C.barra, T, largo) : `<span class="mut">0–${T}′</span>`, 'estado', 'início', largo ? 'duração' : 'tempo', 'gr-eixo'),
    lin(`<span class="trunc"><span class="c-accent">◆</span> <b>Esta sessão</b>${largo ? ' <span class="mut">· Opus 5.5</span>' : ''}</span>`, grBarra(C.barra, T, 0, null, 'active'), 'ativa', '0′', `${T} min`),
  ]
  linhas.forEach((x, i) => {
    if (x.k === 'onda') {
      const glifo = x.aberta ? '▾' : '▸'
      const resumo = largo ? `<span class="mut">· ${x.txt}${x.aberta ? ' em paralelo' : ''}</span> ${grCont(x.cont)}` : `<span class="mut">·</span> ${grCont(x.cont)}`
      rows.push(lin(`<span class="trunc gr-onda"><span class="pn-btn sec gr-tg">${glifo}</span><b>Onda ${x.o}</b> ${resumo}</span>`,
        x.aberta ? '' : grBarra(C.barra, T, x.ini, x.fim, x.cont.error ? 'error' : 'completed', x.marcas),
        x.aberta ? '' : x.cont.error ? '<span class="c-error">com erro</span>' : 'concluída', x.aberta ? '' : `${x.ini}′`, x.aberta ? '' : durGr(x.fim - x.ini), 'gr-o'))
      return
    }
    const [nivel, st, tipo, desc, ini, fim] = x.n
    const trilho = x.solto ? '  ╰' : (d.linhas.some(y => y.k === 'onda') ? '  ' : '') + grTrilho(d.linhas, i)
    const texto = largo || nivel === 1 ? `<b>${tipo}</b> <span class="mut">· ${desc}</span>` : `<b>${tipo}</b>`
    rows.push(lin(`<span class="trunc"><span class="gr-tr">${trilho}</span><span class="c-${st}">${ST[st].g}</span> ${texto}${largo && x.mais ? ` <span class="mut">· ${x.mais}</span>` : ''}</span>`,
      grBarra(C.barra, T, ini, fim, st), `<span class="${st === 'error' ? 'c-error' : st === 'active' ? 'c-active' : ''}">${grEstado[st]}</span>`, `${ini}′`, durGr((fim ?? T) - ini), st === 'error' ? 'gr-erro' : ''))
  })

    n: N(['A árvore com o principal na raiz e os subagentes como filhos.', 'As faixas de concorrência: uma barra por agente no eixo do tempo.'], ['Árvore e tempo numa linha só: à esquerda quem disparou quem, à direita quando rodou. No CCAM são duas telas.', 'A barra é um Svg com largura e altura fixas; no estreito ela tem 7 colunas e só mostra início, fim e sobreposição.', 'No largo entram estado, início e duração por extenso; no estreito, só a duração.']) },
  { id: 'painel-grafo-caotico', cod: 'P13', nome: 'Grafo da sessão, caótico', sub: '25 subagentes em 5 ondas, um com erro, e um general-purpose que disparou os seus. Ondas concluídas ficam recolhidas numa linha; a onda com ativos fica aberta; o erro fica sempre à vista.', html: () => painelGrafo('caotico'),
    n: N(['O agrupamento dos agentes por tipo, com a contagem.', 'Os aninhados do <code>parent_agent_id</code>, em qualquer profundidade.'], ['<b>Agrupar:</b> por onda, o que um mesmo turno da sessão disparou junto. Fora isso, a ordem é a do início.', '<b>Colapsar:</b> onda só de concluídos vira uma linha com a contagem e a barra da onda (um traço por subagente). ▸ abre, ▾ fecha (botões nativos).', '<b>Erro e ativo nunca somem:</b> o erro sai da onda recolhida e fica embaixo dela.', '<b>Aninhados:</b> até 2 níveis com trilho; do 3º para baixo, "+N aninhados" na linha do pai.', '<b>Paginar:</b> pela altura do painel, sem cortar uma linha. No estreito, ‹ 1/2 ›; no largo, cabe numa página.', 'O Select troca entre Todos e Ativos e erros.']) },

  { cap: 'app', titulo: 'App de bandeja (Tauri)', desc: 'O app da decisão 0005 (issues #87 e #88): bandeja, menu e notificação nativos do macOS, e a janela com a interface que o núcleo serve.' },
  { id: 'app-bandeja-0', cod: 'A1', nome: 'Bandeja sem ninguém precisando de você', sub: 'Ninguém precisa de você: só o ícone na barra de menus. As ociosas aparecem só como contagem cinza no resumo.', html: () => `<div class="fila"><div class="mac">${APP.zero()}</div></div>`,

  { id: 'app-bandeja-3', cod: 'A2', nome: 'Bandeja com 3 que precisam de você', sub: 'O número aparece ao lado do ícone e conta só quem precisa de você (#245); as ociosas ficam numa linha cinza, sem número e sem item. Clicar numa sessão abre na janela do app; com ⌥, o item vira "Abrir no Claude Desktop".', html: () => `<div class="fila"><div class="mac">${APP.tres()}</div></div>`,
    n: N(['A ordem do menu do CCAM e o painel do Tabby com Live, Waiting e Errored.'], ['O número vai na barra de menus: é a atenção fora do Claude, o ganho do app (0005).', 'Sessão com erro entra na lista (decisão do dono), em vermelho.', 'Ociosa (Sua vez, Interrompida, No prompt) não entra no número nem na lista: só a contagem cinza (#245).', 'Abrir no Claude Desktop é sempre explícito: um item alternativo com ⌥, nunca o clique padrão.', 'O número fica sem cor (ícone template); a cor vai na bolinha de cada item.']) },
  { id: 'app-notificacao', cod: 'A3', nome: 'Notificação do sistema', sub: 'Quando uma sessão passa a precisar de você ou para com erro; ociosa nunca notifica (#245). Abrir vai para a janela do app; Abrir no Claude Desktop é uma ação à parte.', html: () => `<div class="fila"><div class="mac">${APP.notif()}</div></div>`,
    n: N(['<code>useNotifications</code>: aviso para waiting e erro (lá, no navegador).'], ['Nativa do macOS, aparece com o Claude fechado.', 'Silenciar uma sessão, não tudo (6.8).', 'Notifica só o que trava (Pede permissão, Pergunta, Plano para aprovar, Decisão pedida) e o erro, todos com som. Ociosa não notifica (#245).']) },
  { id: 'app-parado', cod: 'A4', nome: 'Núcleo parado', sub: 'Ninguém subiu o núcleo e não há Node no PATH do login.', html: () => `<div class="fila"><div class="mac">${APP.parado()}</div></div>`,
    n: N(['A adoção do servidor que já responde em <code>/api/health</code> e a correção do PATH (<code>shell-path.ts</code>).'], ['Não embute Node: avisa e deixa o núcleo para a extensão.']) },
  { id: 'app-janela', cod: 'A5', nome: 'A janela', sub: 'Clicar em motor-de-regras no menu abre a janela já no detalhe da sessão (127.0.0.1:4720/ui). O botão "Abrir no Claude Desktop" é o único caminho para o Claude. ⌘O abre no Dashboard.', html: () => `<div class="fila"><div class="mac alto">${APP.janela()}</div></div>`,
    n: N(['A janela do app desktop; fechar esconde e o app fica na bandeja (<code>main.ts</code>).', 'O Session Detail com a faixa de waiting.'], ['Não há uma terceira cópia de telas: é o console servido pelo núcleo.']) },

  { id: 'app-machines', cod: 'A6', nome: 'Bandeja com a Workstation conectada e um alerta', sub: 'O bloco Máquinas: esta máquina e a remota, com o número que mais importa e os alertas abertos. As sessões da Workstation que precisam de você entram na lista de cima, com o rótulo da máquina.', html: () => `<div class="fila"><div class="mac">${APP.machines()}</div></div>`,
    n: N(['O menu do A2, igual; o CCAM não tem telemetria de máquina.', 'Do painel de telemetria antigo: a linha do túnel e o alerta de porta.'], ['Telemetria no menu só como resumo: o detalhe é a janela.', 'Alerta de máquina não entra no número da barra, que é de sessões.', 'Sem ações de túnel, login ou portas: o app só mostra (0008).']) },
  { id: 'app-machines-offline', cod: 'A7', nome: 'Bandeja com a Workstation sem conexão', sub: 'O túnel caiu: a Workstation fica em cinza, com a idade da última leitura e o que o núcleo viu. Uma notificação, sem som, na passagem.', html: () => `<div class="fila"><div class="mac">${APP.machinesOffline()}</div></div>`,

  { cap: 'console', titulo: 'Console (artefato)', desc: 'O console completo, que é também o que a janela do app mostra: todas as telas do CCAM que fazem sentido aqui, na mesma ordem da barra lateral dele. Moldura, cabeçalho, cards, tabelas e gráficos seguem o CCAM tela a tela.' },

  { id: 'console-mural', cod: 'C2', nome: 'Mural ao vivo', sub: 'Um card por sessão aberta, com status, modelo, esforço, plano, agentes, contexto e custo (3.9).', html: () => `<div class="fila">${cc1100('mural', telaMural())}</div>`,

  { id: 'console-sessoes', cod: 'C3', nome: 'Sessões', sub: 'Tabela com busca, filtro por projeto, ordenação e pílulas de status, com "Precisam de você" e "Ociosas" lado a lado (3.3, #245).', html: () => `<div class="fila">${cc1100('sessoes', telaSessoes())}</div>`,

  { id: 'console-det-agentes', cod: 'C4', nome: 'Detalhe · Agentes', sub: 'Números, ferramentas, tarefas, fluxo de tokens e a árvore de agentes com custo por nó (3.4).', html: () => `<div class="fila">${cc('sessoes', telaDetAgentes())}</div>`,

  { id: 'console-det-tempo', cod: 'C6', nome: 'Detalhe · Linha do tempo', sub: 'Os eventos da sessão, filtráveis e expansíveis (3.5).', html: () => `<div class="fila">${cc1100('sessoes', telaLinhaTempo())}</div>`,

  { id: 'console-det-workflow', cod: 'C7', nome: 'Detalhe · Workflow', sub: 'O grafo de agentes da sessão: o laço dev → review → ajustes → review, e a linha do tempo dos agentes em paralelo.', html: () => `<div class="fila">${cc('sessoes', telaDetWorkflow())}</div>`,

  { id: 'console-feed', cod: 'C8', nome: 'Feed de atividade', sub: 'Todos os eventos, ao vivo, com filtros, pausa e uma linha aberta com o detalhe.', html: () => `<div class="fila">${cc1100('feed', telaFeed())}</div>`,

  { id: 'console-kanban-agentes', cod: 'C10', nome: 'Kanban · agentes', sub: '5 colunas: Trabalhando, Precisam de você, Ociosos, Concluídos e Erro (3.6, #245).', html: () => `<div class="fila">${cc1100('kanban', telaKanbanAgentes())}</div>`,

  { id: 'console-analytics', cod: 'C12', nome: 'Analytics · Visão geral', sub: 'Números, atividade de 52 semanas, últimos 30 dias, tokens por modelo, ferramentas e dia da semana.', html: () => `<div class="fila">${cc('analytics', telaAnalytics())}</div>`,
    n: N(['Analytics: 5 StatCards, Event Activity de 52 semanas, Last 30 Days, abas Cost / Token / Productivity, barras horizontais.'], ['O heatmap usa o laranja em 4 tons, sem o índigo do CCAM.', 'Custo virou a aba "Custo" desta tela (3.7); o resto entra a pedido do dono.']) },
  { id: 'console-custo', cod: 'C13', nome: 'Analytics · Custo', sub: 'Custo por dia, por modelo e por projeto (3.7).', html: () => `<div class="fila">${cc('analytics', telaCusto())}</div>`,
    n: N(['Analytics · Cost Analytics: linha diária com pico e total, donut por modelo, barras horizontais.'], ['Gráficos no laranja e nos seus tons, sem uma cor por série.', 'Custo sempre com "~" e "estimativa".']) },
  { id: 'console-workflows', cod: 'C14', nome: 'Workflows', sub: 'KPIs de orquestração, os workflows dinâmicos (dev-review aberto, com fases e agentes) e o grafo de orquestração de todas as sessões.', html: () => `<div class="fila">${cc('workflows', telaWorkflows())}</div>`,

  { id: 'console-historico', cod: 'C15', nome: 'Histórico', sub: 'Sessões encerradas por dia, com a ligação depois do /clear (3.8).', html: () => `<div class="fila">${cc('historico', telaHistorico())}</div>`,

  { id: 'console-config', cod: 'C16', nome: 'Agent Config · Visão geral', sub: 'Raízes copiáveis e o resumo de skills, subagentes, comandos, MCP, plugins, hooks e memória (9.6).', html: () => `<div class="fila">${cc('config', telaConfig())}</div>`,

  { id: 'console-config-skills', cod: 'C17', nome: 'Agent Config · Skills', sub: 'A lista com busca e Nova, e o editor do SKILL.md com Salvar com backup (desligado até o épico 9).', html: () => `<div class="fila">${cc('config', telaConfigSkills())}</div>`,

  { id: 'console-run', cod: 'C18', nome: 'Rodar agente', sub: 'Lançar ou retomar uma sessão com o CLI e o login do usuário (9.5).', html: () => `<div class="fila">${cc('run', telaRun())}</div>`,

  { id: 'console-estados', cod: 'C19', nome: 'Carregando, vazio e erro', sub: 'Os três estados que toda tela tem.', html: () => `<div class="fila">${cc('dashboard', telaVazios(), 0)}</div>`,

  { id: 'console-det-decisoes', cod: 'C20', nome: 'Detalhe · Decisões', sub: 'A aba de decisões da sessão: a linha do tempo com a cadeia de substituição, a injeção no início da sessão, a consulta pelo MCP e "Promover a registro".', html: () => `<div class="fila">${cc('sessoes', telaDetDecisoes())}</div>`,

  { id: 'console-decisoes', cod: 'C21', nome: 'Decisões', sub: 'Todas as decisões, agrupadas por branch, com busca. Responde "o que decidimos sobre X?" sem abrir sessão nenhuma.', html: () => `<div class="fila">${cc('decisoes', telaDecisoes())}</div>`,

  { id: 'console-repos', cod: 'C22', nome: 'Repositórios', sub: 'Todas as organizações e repositórios da conta do GitHub, com atividade, issues, PRs, CI e as sessões que mexem em cada um.', html: () => `<div class="fila">${cc('repos', telaRepos())}</div>`,

  { id: 'console-repo', cod: 'C23', nome: 'Repositório · métricas', sub: 'As métricas que a API do GitHub dá: commits por semana, frequência de código (linhas adicionadas e removidas), issues fechadas por tipo, PRs e tempo até o merge e o review, CI, linguagens, contribuidores, tráfego e alertas.', html: () => `<div class="fila">${cc('repos', telaRepo())}</div>`,

function montar() {
  const main = document.getElementById('telas'), indice = document.getElementById('indice')
  let htmlI = '', htmlM = ''
  for (const t of TELAS) {
    if (t.cap) { htmlI += `<h3>${t.titulo}</h3>`; htmlM += `<div class="capitulo" id="cap-${t.cap}"><h2>${t.titulo}</h2><p>${t.desc}</p></div>`; continue }
    htmlI += `<a href="#${t.id}"><span>${t.cod}</span>${t.nome}</a>`
    htmlM += `<section class="tela" id="${t.id}"><div class="olho">${t.cod}</div><h3>${t.nome}</h3><p>${t.sub}</p><div class="palco">${t.html()}</div>${t.n}</section>`
  }
  htmlI += `<h3>Fechamento</h3><a href="#perguntas"><span>✓</span>Decisões e o que falta</a>`
  htmlM += `<section class="tela perguntas" id="perguntas"><div class="capitulo"><h2>Decisões do dono e o que falta</h2></div><ol>
    <li><b>Motivo de uma pergunta:</b> fica "Pede permissão" (<code>notification</code>), com o tipo dito na faixa.</li>
    <li><b>Clique numa sessão na bandeja:</b> abre na janela do app. Abrir no Claude Desktop é sempre explícito: item alternativo com ⌥ no menu, ação própria na notificação e botão no detalhe (A2, A3, A5).</li>
    <li><b>Barra de contexto:</b> laranja até 79%, vermelha a partir de 80%.</li>
    <li><b>A espera virou dois estados (#245, a aprovar):</b> <b>Precisa de você</b> é o que trava a sessão até você agir (Pede permissão, Pergunta, Plano para aprovar, Decisão pedida, Com erro), em amarelo, com destaque e sempre com o motivo. <b>Ociosa</b> é a sua vez no bate-bola (Sua vez, Interrompida, No prompt), em cor neutra, sem destaque e com o motivo em chip leve. O número da bandeja, o inbox do Dashboard e as notificações contam só "Precisa de você".</li>
    <li><b>Notificação:</b> só quando a sessão passa a precisar de você ou para com erro, todas com som. Ociosa não notifica (#245).</li>
    <li><b>Sessão com erro:</b> <b>entra</b> em "precisam de você" (decidido pelo dono). Ela parou e só anda com uma ação sua, como as travadas; o design.md já diz que o vermelho é "falhou e precisa de você". Mantém a pílula vermelha "Com erro", entra na ordem de quem espera há mais tempo, vai para a bandeja e notifica com som. "Sua vez", "Interrompida" e "No prompt" ficam de fora: são ociosas (#245).</li>
    <li><b>Decisões da sessão:</b> o escopo tem os três níveis (sessão, família e branch), trocados no mesmo seletor; as decisões vigentes chegam à sessão nova pelos dois caminhos, injetadas no início e pelo MCP quando o agente perguntar (P9, P10, C20 e C21).</li>
    <li><b>Onde o grafo vive (#146, a aprovar):</b> a proposta é um detalhe aberto pelo pé do card Subagentes, no lugar dos cards, como as decisões (P11). Dentro do card não cabe; numa seção própria, empurra o resto para baixo.</li>
    <li><b>Telemetria e Dev Console no app (decisão 0008, a aprovar):</b> cada máquina se mede com o próprio núcleo; o do Mac lê o da Workstation pela porta que o túnel encaminha; o app só mostra, sem subir túnel nem abrir login (A6, A7, C24 a C27). A barra lateral ganha Dev Console e a seção Máquinas, que aparece em todas as telas.</li>
    <li><b>Backlog:</b> Feed de atividade, Analytics completo, Workflows e o detalhe com o grafo de agentes estavam para depois da entrega. Entraram aqui a pedido do dono; o PM decide se viram itens da 0.0.1.</li></ol></section>`
  indice.innerHTML = htmlI; main.innerHTML = htmlM
  if (window.lucide) lucide.createIcons()
}
function tema(t) {
  document.documentElement.dataset.theme = t
  document.querySelectorAll('[data-tema]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tema === t)))
  try { localStorage.setItem('wf-tema', t) } catch {}
}
document.querySelectorAll('[data-tema]').forEach(b => b.addEventListener('click', () => tema(b.dataset.tema)))
let salvo = null; try { salvo = localStorage.getItem('wf-tema') } catch {}
const q = new URLSearchParams(location.search)
tema(q.get('tema') ?? salvo ?? 'dark')
montar()
if (q.get('captura')) { document.body.classList.add('captura'); document.getElementById(q.get('captura'))?.classList.add('alvo') }
</script>
