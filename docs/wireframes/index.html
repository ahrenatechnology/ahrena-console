/* Layout: índice fixo à esquerda e, à direita, cada tela num quadro do tamanho real, com o que veio do CCAM embaixo. */
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: var(--text-md); line-height: 1.5; }

/* ---------- página ---------- */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));

.topo .dir { margin-left: auto; display: flex; gap: 6px; }

.seg button, .seg span { font: inherit; font-size: var(--text-xs); color: var(--muted); background: none; border: 0; padding: 4px 10px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

.pagina { display: grid; grid-template-columns: 230px minmax(0, 1fr); }

main { min-width: 0; padding-block: 24px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.tela { margin: 0 0 56px; scroll-margin-top: 70px; }

.tela h3 { margin: 2px 0 2px; font-size: var(--text-lg); font-weight: 600; text-wrap: balance; }

.c-blocked { color: var(--status-waiting-text); } .c-idle { color: var(--muted); }
.c-error { color: var(--status-error-text); } .c-abandoned { color: var(--status-abandoned-text); } .c-muted { color: var(--muted); } .c-accent { color: var(--accent-text); }

/* detalhe */

const frameAt = (w, active, body, ws = 'ok') => `<div class="cc w${w}">${lado(active, 3, ws)}<div class="cc-main">${body}</div></div>`
const wave = (seed, n, base, amp) => Array.from({ length: n }, (_, i) => Math.max(0, base + amp * Math.sin(seed + i * 0.31) * Math.cos(seed * 0.7 + i * 0.09) + amp * 0.35 * Math.sin(i * 1.3 + seed)))
function tmSeries(series, { max, limit, h = 120 } = {}) {
  const W = 600, y = v => (h - 4 - v / max * (h - 14)).toFixed(1)
  const grid = [0.25, 0.5, 0.75, 1].map(f => `<line x1="0" x2="${W}" y1="${y(f * max)}" y2="${y(f * max)}" stroke="var(--border)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('')
  const limitLine = limit != null ? `<line x1="0" x2="${W}" y1="${y(limit)}" y2="${y(limit)}" stroke="var(--status-error-dot)" stroke-dasharray="5 4" stroke-width="1.2" vector-effect="non-scaling-stroke"/>` : ''
  const lines = series.map(([v, cor]) => `<polyline points="${v.map((n, i) => `${(i * W / (v.length - 1)).toFixed(1)},${y(n)}`).join(' ')}" fill="none" stroke="${cor}" stroke-width="1.7" vector-effect="non-scaling-stroke"/>`).join('')
  return `<svg class="tm-serie" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" aria-hidden="true">${grid}${limitLine}${lines}</svg>`
}
const tmAxis = h => `<div class="tm-axis">${h === 12 ? '<span>−12 h</span><span>−9 h</span><span>−6 h</span><span>−3 h</span>' : '<span>−60 min</span><span>−45</span><span>−30</span><span>−15</span>'}<span>agora</span></div>`
const tmColor = pct => pct >= 90 ? 'var(--status-error-dot)' : pct >= 80 ? 'var(--status-waiting-dot)' : 'var(--accent)'
const tmMeter = (label, used, total, unit, extra = '') => {
  const pct = Math.round(used / total * 100)
  return `<div class="tm-meter"><div class="top"><b class="mono" style="font-weight:500">${label}</b><span>${String(used).replace('.', ',')} de ${total} ${unit} · ${pct}%${extra}</span></div>${barra(pct, tmColor(pct))}</div>`
}
const tmAlerts = l => `<div class="tm-alerts">${l.map(([level, t, s, h]) => `<div><span class="ic c-${level}">${ic(level === 'error' ? 'x-circle' : level === 'waiting' ? 'alert-triangle' : level === 'completed' ? 'check-circle-2' : 'info')}</span><div>${t}${s ? `<small>${s}</small>` : ''}</div>${h ? `<span class="t">${h}</span>` : ''}</div>`).join('')}</div>`

// A barra do tempo: um Svg com largura e altura explícitas, como o mod exige.
function grBarra(cols, T, ini, fim, st, marcas) {
  const w = Math.round(cols * CH), h = 12, x = v => Math.round(v / T * (w - 2)) + 1
  const ate = fim ?? T
  const cor = `var(--status-${st}-dot)`
  const fundo = `<rect x="0" y="5" width="${w}" height="2" rx="1" fill="var(--border)"/>`
  if (marcas) return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${fundo}<rect x="${x(ini)}" y="2" width="${Math.max(3, x(ate) - x(ini))}" height="8" rx="2" fill="${cor}" opacity=".28"/>${marcas.map(m => `<rect x="${x(m)}" y="2" width="2" height="8" fill="${cor}"/>`).join('')}</svg>`
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${fundo}<rect x="${x(ini)}" y="2" width="${Math.max(3, x(ate) - x(ini))}" height="8" rx="2" fill="${cor}"/>${fim == null ? `<rect x="${x(ate) - 2}" y="0" width="2" height="12" fill="${cor}"/>` : ''}</svg>`
}
// A régua em cima das barras: 0 à esquerda, o tempo da sessão à direita, "agora" no fim.
function grRegua(cols, T, largo) {
  const w = Math.round(cols * CH)
  const passo = T < 30 ? 5 : 10
  const marcas = Array.from({ length: Math.floor(T / passo) + 1 }, (_, i) => i * passo).filter(m => m === 0 || m <= T - passo / 2)
  return `<svg width="${w}" height="14" viewBox="0 0 ${w} 14">${marcas.map(m => { const x = Math.round(m / T * (w - 2)) + 1; return `<rect x="${x}" y="9" width="1" height="5" fill="var(--muted)"/><text x="${m === 0 ? 0 : x - 3}" y="8" font-size="9.5" fill="var(--muted)" font-family="var(--font-mono)">${m}′</text>` }).join('')}
    <rect x="${w - 1}" y="9" width="1" height="5" fill="var(--muted)"/><text x="${w}" y="8" text-anchor="end" font-size="9.5" fill="var(--muted)" font-family="var(--font-mono)">${T}′</text></svg>`
}
// O trilho à esquerda (quem disparou quem): ├ e ╰ por nível, │ quando o pai ainda tem irmãos abaixo.
function grTrilho(l, i) {
  const nivel = l[i].n[0]
  const temIrmaoAbaixo = niv => { for (let j = i + 1; j < l.length; j++) { if (l[j].k !== 'no' || l[j].n[0] < niv) return false; if (l[j].n[0] === niv) return true } return false }
  let s = ''
  for (let v = 1; v < nivel; v++) s += temIrmaoAbaixo(v) ? '│ ' : '  '
  return s + (temIrmaoAbaixo(nivel) ? '├' : '╰')
}
const grCont = c => ['active', 'error', 'completed'].filter(st => c[st]).map(st => `<span class="c-${st}">${c[st]} ${ST[st].g}</span>`).join(' ')
const grEstado = { active: 'ativo', completed: 'concluído', error: 'com erro' }

function grafo(nome, largo) {
  const d = GR[nome]
  const T = d.tempo
  const C = largo ? { nome: 40, barra: 36 } : { nome: 16, barra: 7 }
  const grid = largo ? `grid-template-columns:${C.nome}ch ${C.barra}ch 9ch 6ch 7ch` : `grid-template-columns:${C.nome}ch ${C.barra}ch 6ch`
  const lin = (a, b, c3, c4, c5, cls = '') => `<div class="gr-ln ${cls}" style="${grid}">${a}<span>${b}</span>${largo ? `<span class="mut">${c3 ?? ''}</span><span class="mut">${c4 ?? ''}</span>` : ''}<span class="mut gr-d">${c5 ?? ''}</span></div>`
  const linhas = largo || nome === 'simples' ? d.linhas : d.linhas.slice(0, 9)
  const rows = [
    lin(`<span class="mut gr-cab">${largo ? 'quem disparou quem' : 'quem disparou'}</span>`, largo ? grRegua(C.barra, T, largo) : `<span class="mut">0–${T}′</span>`, 'estado', 'início', largo ? 'duração' : 'tempo', 'gr-eixo'),
    lin(`<span class="trunc"><span class="c-accent">◆</span> <b>Esta sessão</b>${largo ? ' <span class="mut">· Opus 5.5</span>' : ''}</span>`, grBarra(C.barra, T, 0, null, 'active'), 'ativa', '0′', `${T} min`),
  ]
  linhas.forEach((x, i) => {
    if (x.k === 'onda') {
      const glifo = x.aberta ? '▾' : '▸'
      const resumo = largo ? `<span class="mut">· ${x.txt}${x.aberta ? ' em paralelo' : ''}</span> ${grCont(x.cont)}` : `<span class="mut">·</span> ${grCont(x.cont)}`
      rows.push(lin(`<span class="trunc gr-onda"><span class="pn-btn sec gr-tg">${glifo}</span><b>Onda ${x.o}</b> ${resumo}</span>`,
        x.aberta ? '' : grBarra(C.barra, T, x.ini, x.fim, x.cont.error ? 'error' : 'completed', x.marcas),
        x.aberta ? '' : x.cont.error ? '<span class="c-error">com erro</span>' : 'concluída', x.aberta ? '' : `${x.ini}′`, x.aberta ? '' : durGr(x.fim - x.ini), 'gr-o'))
      return
    }
    const [nivel, st, tipo, desc, ini, fim] = x.n
    const trilho = x.solto ? '  ╰' : (d.linhas.some(y => y.k === 'onda') ? '  ' : '') + grTrilho(d.linhas, i)
    const texto = largo || nivel === 1 ? `<b>${tipo}</b> <span class="mut">· ${desc}</span>` : `<b>${tipo}</b>`
    rows.push(lin(`<span class="trunc"><span class="gr-tr">${trilho}</span><span class="c-${st}">${ST[st].g}</span> ${texto}${largo && x.mais ? ` <span class="mut">· ${x.mais}</span>` : ''}</span>`,
      grBarra(C.barra, T, ini, fim, st), `<span class="${st === 'error' ? 'c-error' : st === 'active' ? 'c-active' : ''}">${grEstado[st]}</span>`, `${ini}′`, durGr((fim ?? T) - ini), st === 'error' ? 'gr-erro' : ''))

const widthCol = (w, label, body) => `<div class="width-col" data-w="${w}"><div class="rotulo">${label}</div>${body}</div>`
const smAccount = `<span class="sm-account"><i class="sm-account-dot"></i>Pessoal (simulada)</span>`
// `rc`: Remote Control is on for the session. On: a chip on the destination line. Off: a disabled "Remote control" button in the row.
const smDest = (s, where = 'Claude Desktop', rc = false) => `<div class="sm-dest"><span class="c-muted">Para</span><b class="trunc">${s.nome}</b><span class="chip">${ic('monitor')}${where}</span>${smAccount}${rc ? `<span class="sm-rc">${ic('radio')}Remote Control ligado</span>` : ''}<span class="sm-live">${ponto('completed')}processo vivo nesta máquina</span></div>`
const smNote = `<span class="sm-note">${ic('info')}<span>Chega à sessão como mensagem <b style="color:var(--text);font-weight:500">de outra sessão</b>: não aprova permissão, não roda comando e não muda configuração.</span></span>`
const smCommands = (rc = false) => `<span class="sm-cmd" title="/compact chegaria como texto: só o mod do painel roda comandos">/compact</span><span class="sm-cmd" title="/clear chegaria como texto: só o mod do painel roda comandos">/clear</span>${rc ? '' : `<span class="sm-cmd sm-cmd-rc" title="Ligar o Remote Control desta sessão depende do mod do painel">${ic('radio')}Remote control</span>`}<span class="sm-why">${ic('lock')}dependem do mod</span>`
const smSend = (label = 'Enviar', off = false, icon = 'corner-down-left') => `<span class="btn cheio sm-send${off ? ' sm-disabled' : ''}">${ic(icon)}${label}${label === 'Enviar' ? ' <span class="sm-kbd">⌘↵</span>' : ''}</span>`
const smStatus = (kind, icon, html, action = '') => `<div class="sm-status sm-${kind}">${ic(icon)}<div>${html}</div>${action}</div>`

/** The compose box. `text` is what the person typed; it only ever lives in the box, never comes back from a log. */
function smCompose({ s, dest = true, text = '', focus = false, faded = false, status = '', send = smSend(), note = smNote, commands = true, rc = false, off = false, placeholder = 'Escreva para a sessão… (⌘↵ envia)' }) {
  const body = text ? `${text}${focus ? '<span class="sm-caret"></span>' : ''}<span class="sm-count">${text.length} / 16 KiB</span>` : `<span class="sm-ph">${placeholder}</span>`
  return `<div class="cartao sm-compose${off ? ' sm-off' : ''}">
    ${dest && s ? smDest(s, 'Claude Desktop', rc) : ''}
    <div class="sm-text${focus ? ' sm-focus' : ''}${faded ? ' sm-faded' : ''}">${body}</div>
    ${status}
    <div class="sm-foot">${note}<span class="sm-actions">${commands ? smCommands(rc) : ''}${send}</span></div>
  </div>`
}

}

  { id: 'app-notificacao', cod: 'A3', nome: 'Notificação do sistema', sub: 'Quando uma sessão passa a precisar de você ou para com erro; ociosa nunca notifica (#245). Abrir vai para a janela do app; Abrir no Claude Desktop é uma ação à parte.', html: () => `<div class="fila"><div class="mac">${APP.notif()}</div></div>`,
    n: N(['<code>useNotifications</code>: aviso para waiting e erro (lá, no navegador).'], ['Nativa do macOS, aparece com o Claude fechado.', 'Silenciar uma sessão, não tudo (6.8).', 'Notifica só o que trava (Pede permissão, Pergunta, Plano para aprovar, Decisão pedida) e o erro, todos com som. Ociosa não notifica (#245).']) },
  { id: 'app-parado', cod: 'A4', nome: 'Núcleo parado', sub: 'Ninguém subiu o núcleo e não há Node no PATH do login.', html: () => `<div class="fila"><div class="mac">${APP.parado()}</div></div>`,
    n: N(['A adoção do servidor que já responde em <code>/api/health</code> e a correção do PATH (<code>shell-path.ts</code>).'], ['Não embute Node: avisa e deixa o núcleo para a extensão.']) },
  { id: 'app-janela', cod: 'A5', nome: 'A janela', sub: 'Clicar em motor-de-regras no menu abre a janela já no detalhe da sessão (127.0.0.1:4720/ui). O botão "Abrir no Claude Desktop" é o único caminho para o Claude. ⌘O abre no Dashboard.', html: () => `<div class="fila"><div class="mac alto">${APP.janela()}</div></div>`,
    n: N(['A janela do app desktop; fechar esconde e o app fica na bandeja (<code>main.ts</code>).', 'O Session Detail com a faixa de waiting.'], ['Não há uma terceira cópia de telas: é o console servido pelo núcleo.']) },

  { id: 'app-machines', cod: 'A6', nome: 'Bandeja com a Workstation conectada e um alerta', sub: 'O bloco Máquinas: esta máquina e a remota, com o número que mais importa e os alertas abertos. As sessões da Workstation que precisam de você entram na lista de cima, com o rótulo da máquina.', html: () => `<div class="fila"><div class="mac">${APP.machines()}</div></div>`,
    n: N(['O menu do A2, igual; o CCAM não tem telemetria de máquina.', 'Do painel de telemetria antigo: a linha do túnel e o alerta de porta.'], ['Telemetria no menu só como resumo: o detalhe é a janela.', 'Alerta de máquina não entra no número da barra, que é de sessões.', 'Sem ações de túnel, login ou portas: o app só mostra (0008).']) },
  { id: 'app-machines-offline', cod: 'A7', nome: 'Bandeja com a Workstation sem conexão', sub: 'O túnel caiu: a Workstation fica em cinza, com a idade da última leitura e o que o núcleo viu. Uma notificação, sem som, na passagem.', html: () => `<div class="fila"><div class="mac">${APP.machinesOffline()}</div></div>`,
    n: N(['Do painel de telemetria antigo: os estados da porta (respondendo, ninguém escuta lá, ocupada, fora do túnel).'], ['O painel antigo tinha "Subir o túnel"; aqui não: o app não conhece o túnel. Reconectar, quando configurado, roda só o comando que você escreveu (A8).']) },
  { id: 'app-machines-reconnect', cod: 'A8', nome: 'Bandeja: Reconectar', sub: 'Feature Reconectar a máquina remota (#244, decisão 0012). À esquerda, com reconnect configurado: o item Reconectar a Workstation e a notificação com a ação Reconectar. À direita, o comando rodando (cinza, sem clique) e, sem reconnect, o item que ensina a configurar.', html: () => `<div class="fila"><div class="mac">${APP.machinesReconnect()}</div><div class="mac">${APP.machinesReconnecting()}</div></div>`,
    n: N(['Do painel de telemetria antigo: o "Subir o túnel" na linha da máquina; aqui o comando é o seu, não um que o app conhece.'], ['Só aparece com <code>reconnect</code> no machines.json; sem ele, um item leva ao passo a passo (C50, estado 5).', 'Um por vez: o item fica cinza com a contagem enquanto o comando roda, venha o clique daqui ou da janela.', 'Cancelar fica na janela: na bandeja não cabe confirmação.']) },
  { id: 'app-clouds-connection', cod: 'A9', nome: 'Bandeja: Nuvens e a conexão da Workstation', sub: 'Features Contas de nuvem (#277) e A conexão da máquina remota (#278), decisão 0013. À esquerda, o túnel no ar e o bloco Nuvens com a sessão que expira em 14 min e Entrar. À direita, de manhã: o túnel fora por SSO expirado, com Entrar na AWS e subir o túnel, e o item cinza enquanto roda.', html: () => `<div class="fila"><div class="mac">${APP_CL.up()}</div><div class="mac">${APP_CL.down()}</div></div>`,
    n: N(['Nada.'], ['A bandeja roda o mesmo que a janela, pela mesma rota local (sem Origin, Host em loopback, como a A8).', 'O número da barra continua só de sessões: nuvem e túnel não contam.']) },
  { id: 'app-clouds-notifications', cod: 'A10', nome: 'Notificações da nuvem e da conexão', sub: 'A sessão que vai expirar, a queda por SSO expirado e a queda por porta ocupada: o motivo no título e a ação que resolve. Todas sem som.', html: () => `<div class="fila"><div class="mac">${APP_CL.notifs()}</div></div>`, n: '' },
  { cap: 'console', titulo: 'Console (artefato)', desc: 'O console completo, que é também o que a janela do app mostra: todas as telas do CCAM que fazem sentido aqui, na mesma ordem da barra lateral dele. Moldura, cabeçalho, cards, tabelas e gráficos seguem o CCAM tela a tela.' },
  { id: 'console-dashboard', cod: 'C1', nome: 'Dashboard', sub: '6 cards, "precisam de você" em destaque (só o que trava, #245), as ociosas numa linha neutra à parte, agentes ativos e atividade recente (3.2).', html: () => `<div class="fila">${cc1100('dashboard', telaDashboard())}</div>`,
    n: N(['Dashboard · Monitor: grade 3 × 2 de StatCard, Active Agents com AgentCard (borda na cor do status, duas últimas mensagens, modelo, custo, idade, id) e Recent Activity.', 'Cabeçalho de página com ícone, título, pílula Live e Refresh; segmented Monitor | Saúde.'], ['O inbox "precisam de você" entra entre os números e as listas, ideia do Podium.', 'Ociosas (#245): uma linha neutra logo abaixo do inbox, sem fundo amarelo, com o motivo em chip leve. Ficam visíveis sem disputar atenção.', 'Custo sempre com "~" e "estimativa".']) },
  { id: 'console-mural', cod: 'C2', nome: 'Mural ao vivo', sub: 'Um card por sessão aberta, com status, modelo, esforço, plano, agentes, contexto e custo (3.9).', html: () => `<div class="fila">${cc1100('mural', telaMural())}</div>`,
    n: N(['O SessionCard e as barras de progresso do Task Progress.'], ['O mural é do Podium; o CCAM não tem. Cards do mesmo tamanho, 3 por linha.', 'Precisa de você: borda amarela e chip forte. Ociosa: borda cinza e chip leve (#245).']) },
  { id: 'console-sessoes', cod: 'C3', nome: 'Sessões', sub: 'Tabela com busca, filtro por projeto, ordenação e pílulas de status, com "Precisam de você" e "Ociosas" lado a lado (3.3, #245).', html: () => `<div class="fila">${cc1100('sessoes', telaSessoes())}</div>`,
    n: N(['Sessions: barra de filtros (busca, projeto, ordenação, pílulas) e a tabela com Session, Status com motivo, Last active, Duration, Agents, Cost e Directory.'], ['10 por página. Duração "rodando" em laranja.', 'Em 1100 o diretório desce para baixo do nome, junto do id, e a coluna Agentes sai (fica no detalhe), para a tabela não rolar na horizontal.', 'As pílulas trazem a contagem. "Precisam de você" inclui as com erro, que também têm a sua pílula.']) },
  { id: 'console-det-agentes', cod: 'C4', nome: 'Detalhe · Agentes', sub: 'Números, ferramentas, tarefas, fluxo de tokens e a árvore de agentes com custo por nó (3.4).', html: () => `<div class="fila">${cc('sessoes', telaDetAgentes())}</div>`,
    n: N(['Session Detail · Agents: chips copiáveis, 6 KPIs, Top Tools, Task Progress, Token Flow e a árvore de agentes.'], ['Barras de ferramenta no laranja, sem uma cor por ferramenta: a paleta fica fechada.', 'Custo por nó da árvore.']) },
  { id: 'console-det-conversa', cod: 'C5', nome: 'Detalhe · Conversa', sub: 'Em cima, a sessão precisa de você (pede uma permissão): faixa amarela no topo e o bloco da ferramenta aguardando. Embaixo, uma sessão ociosa (o turno acabou): sem faixa, só uma linha neutra (3.5, #245).', html: () => `<div style="display:flex;flex-direction:column;gap:16px">${cc1100('sessoes', telaConversa())}${cc1100('sessoes', telaConversaIdle())}</div>`,
    n: N(['Conversation: seletor de agente, mensagens com modelo e tokens, blocos de ferramenta que expandem, código inline.', 'A faixa amarela de waiting do Session Detail.'], ['"Abrir no Claude Desktop", com o nome inteiro, no lugar de responder ali: responder é o épico 9.', 'A faixa amarela só aparece quando a sessão trava. Ociosa não tem faixa (#245).']) },
  { id: 'console-det-tempo', cod: 'C6', nome: 'Detalhe · Linha do tempo', sub: 'Os eventos da sessão, filtráveis e expansíveis (3.5).', html: () => `<div class="fila">${cc1100('sessoes', telaLinhaTempo())}</div>`,
    n: N(['Timeline: busca, intervalo De–Até, filtros Status, Event type, Tool e Agent, linhas que expandem com o chip da ferramenta.'], ['O tipo do hook aparece na linha, para ler a máquina de estados.']) },
  { id: 'console-det-workflow', cod: 'C7', nome: 'Detalhe · Workflow', sub: 'O grafo de agentes da sessão: o laço dev → review → ajustes → review, e a linha do tempo dos agentes em paralelo.', html: () => `<div class="fila">${cc('sessoes', telaDetWorkflow())}</div>`,
    n: N(['Session Drill-In da tela Workflows: árvore de agentes e timeline de ferramentas da sessão.', 'Concurrency Timeline: faixas por agente.', 'Dynamic Workflows dentro do Session Detail.'], ['Uma aba própria no detalhe, porque o laço dev/review é o que se quer ver numa sessão.', 'A volta do review para o dev é uma aresta tracejada em vermelho (ajustes pedidos), com o número da rodada no nó.']) },
  { id: 'console-feed', cod: 'C8', nome: 'Feed de atividade', sub: 'Todos os eventos, ao vivo, com filtros, pausa e uma linha aberta com o detalhe.', html: () => `<div class="fila">${cc1100('feed', telaFeed())}</div>`,
    n: N(['Activity Feed: banner "About events", EventFilters (busca, De–Até, Status, Event type, Tool, Session), linhas com hora, pílula, breadcrumb projeto › sessão › agente, chip da ferramenta e Session ↗; EventDetail com resumo e chave-valor; Pause.'], ['No backlog estava para depois da entrega; entra no pacote a pedido do dono (precisa de item no épico 3).']) },
  { id: 'console-kanban', cod: 'C9', nome: 'Kanban · sessões', sub: '5 colunas por status, só leitura, 3 cards e "mostrar mais" (3.6). A antiga coluna de espera virou duas: "Precisam de você" (com as de erro) e "Ociosas", tracejada e neutra (#245).', html: () => `<div class="fila">${cc1100('kanban', telaKanban())}</div>`,
    n: N(['Kanban Board · Sessions: colunas com ponto, título em caixa alta e contador; SessionCard com id, última mensagem, cwd, agentes, modelo, custo e "running".'], ['Cards de altura fixa: nenhum cresce com o texto.', 'Sem coluna "Com erro": a sessão com erro trava e vai para "Precisam de você", em vermelho, como no núcleo (grupo blocking). Assim o quadro fica em 5 colunas e cabe em 1100.']) },
  { id: 'console-kanban-agentes', cod: 'C10', nome: 'Kanban · agentes', sub: '5 colunas: Trabalhando, Precisam de você, Ociosos, Concluídos e Erro (3.6, #245).', html: () => `<div class="fila">${cc1100('kanban', telaKanbanAgentes())}</div>`,
    n: N(['Kanban Board · Agents (<code>AGENT_COLUMNS</code>).'], ['"Trabalhando" usa o laranja de "Ativa".']) },
  { id: 'console-projeto', cod: 'C11', nome: 'Kanban do projeto', sub: 'O GitHub Project por Status; arrastar um card muda o Status no GitHub (3.10).', html: () => `<div class="fila">${cc('projeto', telaProjeto())}</div>`,
    n: N(['A moldura do Kanban Board.'], ['O CCAM não arrasta; aqui arrastar escreve no GitHub, com confirmação e Desfazer.', 'Tipo da issue, PR, CI e review no card.']) },
  { id: 'console-analytics', cod: 'C12', nome: 'Analytics · Visão geral', sub: 'Números, atividade de 52 semanas, últimos 30 dias, tokens por modelo, ferramentas e dia da semana.', html: () => `<div class="fila">${cc('analytics', telaAnalytics())}</div>`,
    n: N(['Analytics: 5 StatCards, Event Activity de 52 semanas, Last 30 Days, abas Cost / Token / Productivity, barras horizontais.'], ['O heatmap usa o laranja em 4 tons, sem o índigo do CCAM.', 'Custo virou a aba "Custo" desta tela (3.7); o resto entra a pedido do dono.']) },
  { id: 'console-custo', cod: 'C13', nome: 'Analytics · Custo', sub: 'Custo por dia, por modelo e por projeto (3.7).', html: () => `<div class="fila">${cc('analytics', telaCusto())}</div>`,
    n: N(['Analytics · Cost Analytics: linha diária com pico e total, donut por modelo, barras horizontais.'], ['Gráficos no laranja e nos seus tons, sem uma cor por série.', 'Custo sempre com "~" e "estimativa".']) },
  { id: 'console-delivery', cod: 'C54', nome: 'Analytics · Entregas, por repositório', sub: 'Feature Entregas (#266): o ritmo de entrega de cada repositório no GitHub e o esforço do Claude no mesmo repositório, nunca por pessoa. O seletor Por repositório · Por projeto troca o eixo de tudo. Números do período, as contribuições por tipo (PRs abertos e mesclados, issues abertas e fechadas, revisões: linhas são repositórios, a cor é o peso dentro da linha), um gráfico pequeno por repositório com os PRs mesclados por dia (escala própria, pico e total no canto, horas do Claude tracejadas atrás), a tabela Esforço e entrega com o custo por PR mesclado, e o que está aberto, dos mais antigos primeiro, com busca. Em 1100 e 1440.', html: () => `<div style="display:flex;flex-direction:column;gap:12px"><div class="rotulo">1100 px · a janela do app</div>${frameAt(1100, 'analytics', telaEntregas(1100))}<div class="rotulo">1440 px</div>${frameAt(1440, 'analytics', telaEntregas(1440))}</div>`,
    n: N(['Nada do CCAM: ele não lê o GitHub. As formas vêm de um painel de entregas que já usamos: os gráficos pequenos com pico e total, a tabela com a cor pelo peso e a lista dos abertos com busca.'], ['As linhas são repositórios ou projetos, nunca pessoas: no painel de referência as linhas são pessoas; aqui não há autor, responsável nem eixo por pessoa.', 'O repositório de uma sessão vem do cwd, como na tela Repositórios; sem sessão no período, horas e custo são "—", nunca zero.', 'Custo por PR é custo ÷ PRs mesclados: uma ponte entre os dois lados, não uma meta.']) },
  { id: 'console-delivery-projects', cod: 'C55', nome: 'Analytics · Entregas, por projeto', sub: 'Por projeto: o mesmo seletor troca o eixo de toda a aba para os GitHub Projects que o console já lê (Kanban do projeto, C11), e um projeto junta issues e PRs de vários repositórios. As contribuições, o ritmo, o esforço e o custo do Claude e o Em andamento passam a ter uma linha por projeto. Cada gráfico diz os repositórios do projeto; o esforço do Claude de um projeto é a soma das sessões desses repositórios. Em 1100.', html: () => `<div class="fila">${frameAt(1100, 'analytics', telaEntregas(1100, true))}</div>`,
    n: N(['—'], ['Um repositório em dois projetos conta nos dois; a soma dos projetos pode passar do total da aba.', 'Os itens de um projeto que não são de repositório (rascunhos do Project) não entram.']) },
  { id: 'console-delivery-states', cod: 'C56', nome: 'Analytics · Entregas, estados', sub: 'Sem GitHub conectado: o estado vazio explica como conectar, sem escolher repositório por você (regra 5). GitHub fora ou limitando: o cache com a hora, e as horas e o custo do Claude em dia, que vêm das sessões. Em 1100.', html: () => `<div class="fila">${frameAt(1100, 'analytics', telaEntregasEstados())}</div>`,
    n: N(['Os estados do C19.'], ['Só o lado do GitHub desbota: o lado do Claude é local e continua ao vivo.']) },
  { id: 'console-workflows', cod: 'C14', nome: 'Workflows', sub: 'KPIs de orquestração, os workflows dinâmicos (dev-review aberto, com fases e agentes) e o grafo de orquestração de todas as sessões.', html: () => `<div class="fila">${cc('workflows', telaWorkflows())}</div>`,
    n: N(['Workflows: 6 KPIs (profundidade, subagentes por sessão, sucesso, fluxo mais comum), Dynamic Workflows com chips de fase e tabela Agent / Phase / State / Tokens / Tools / Duration, e o Agent Orchestration Graph em colunas com arestas de espessura pelo volume.'], ['KPI "Rodadas de review por PR" no lugar de "Avg Compactions": é o que mede o laço dev/review.', 'Só o grafo de orquestração das 11 seções; as outras ficam para depois.']) },
  { id: 'console-historico', cod: 'C15', nome: 'Histórico', sub: 'Sessões encerradas por dia, com a ligação depois do /clear (3.8).', html: () => `<div class="fila">${cc('historico', telaHistorico())}</div>`,
    n: N(['As linhas do Activity Feed e da tabela de Sessions.'], ['A ligação entre sessões depois do <code>/clear</code> vem do Podium.']) },
  { id: 'console-config', cod: 'C16', nome: 'Agent Config · Visão geral', sub: 'Raízes copiáveis e o resumo de skills, subagentes, comandos, MCP, plugins, hooks e memória (9.6).', html: () => `<div class="fila">${cc('config', telaConfig())}</div>`,
    n: N(['Agent Config: escopo Todos / Usuário / Projeto, Backups, abas com contador, Roots copiáveis e Quick summary em grade de cards.'], ['Sem a aba Codex: o console é do Claude Code.', 'Faixa no topo: editar fica desligado até o épico 9 liberar (escreve em <code>~/.claude</code>).']) },
  { id: 'console-config-skills', cod: 'C17', nome: 'Agent Config · Skills', sub: 'A lista com busca e Nova, e o editor do SKILL.md com Salvar com backup (desligado até o épico 9).', html: () => `<div class="fila">${cc('config', telaConfigSkills())}</div>`,
    n: N(['A lista de Skills (busca, + New, card com escopo, descrição, caminho, View source / Edit / Delete) e o editor de texto com backup antes de gravar (<code>cc-mutate.js</code>).'], ['Editor ao lado da lista, sem trocar de tela.', 'Apagar em vermelho e salvar com o backup no rótulo.']) },
  { id: 'console-run', cod: 'C18', nome: 'Rodar agente', sub: 'Lançar ou retomar uma sessão com o CLI e o login do usuário (9.5).', html: () => `<div class="fila">${cc('run', telaRun())}</div>`,
    n: N(['Run Agent: painel "Works here / CLI only", Mode (Conversation, One-shot), Source session (New, Resume), Prompt, Working directory, Model e Permission mode; "Dashboard runs".'], ['Sem Codex.', 'Desligado por padrão (épico 9): quem lança é o núcleo, com o CLI e o login do usuário (0005).']) },
  { id: 'console-estados', cod: 'C19', nome: 'Carregando, vazio e erro', sub: 'Os três estados que toda tela tem.', html: () => `<div class="fila">${cc('dashboard', telaVazios(), 0)}</div>`,
    n: N(['EmptyState, Skeleton e o aviso inline de erro de API.'], ['Erro do GitHub mostra o cache e a hora dele (decisão 0001).']) },
  { id: 'console-det-decisoes', cod: 'C20', nome: 'Detalhe · Decisões', sub: 'A aba de decisões da sessão: a linha do tempo com a cadeia de substituição, a injeção no início da sessão, a consulta pelo MCP e "Promover a registro".', html: () => `<div class="fila">${cc('sessoes', telaDetDecisoes())}</div>`,
    n: N(['A moldura do Session Detail e as linhas do Activity Feed.'], ['Território novo: nenhuma ferramenta de referência guarda decisões.', 'Escopo Sessão, Família ou Branch no mesmo seletor.', '"Promover a registro" gera um rascunho em <code>docs/decisoes/</code>, como os registros 0001 a 0005 deste projeto.']) },
  { id: 'console-decisoes', cod: 'C21', nome: 'Decisões', sub: 'Todas as decisões, agrupadas por branch, com busca. Responde "o que decidimos sobre X?" sem abrir sessão nenhuma.', html: () => `<div class="fila">${cc('decisoes', telaDecisoes())}</div>`,
    n: N(['StatCards e a lista agrupada do Histórico.'], ['Agrupa por branch, porque é onde as decisões de várias sessões se encontram.']) },
  { id: 'console-repos', cod: 'C22', nome: 'Repositórios', sub: 'Todas as organizações e repositórios da conta do GitHub, com atividade, issues, PRs, CI e as sessões que mexem em cada um.', html: () => `<div class="fila">${cc('repos', telaRepos())}</div>`,
    n: N(['A tabela de Sessions (filtros, pílulas, linha que leva ao detalhe) e os StatCards.'], ['O CCAM não lê o GitHub; aqui o repositório liga as sessões ao trabalho.', 'Lido com a consulta enxuta e o cache da decisão 0001, para não estourar o limite da API.']) },
  { id: 'console-repo', cod: 'C23', nome: 'Repositório · métricas', sub: 'As métricas que a API do GitHub dá: commits por semana, frequência de código (linhas adicionadas e removidas), issues fechadas por tipo, PRs e tempo até o merge e o review, CI, linguagens, contribuidores, tráfego e alertas.', html: () => `<div class="fila">${cc('repos', telaRepo())}</div>`,
    n: N(['O cabeçalho com chips do Session Detail, os 6 KPIs, barras horizontais e a barra empilhada do Token Flow.'], ['"Linhas de código" não vem pronta do GitHub: soma a frequência de código (adições − remoções) desde o primeiro commit; os bytes por linguagem ficam ao lado.', 'Issues por tipo usam os tipos de issue da organização (História, Tarefa técnica, Bug, Spike, Épico).', '"Abertos por agentes" cruza os PRs com as sessões que os abriram.', 'Tráfego, Dependabot e code scanning exigem acesso de escrita; sem ele, o card some.']) },
  { id: 'console-this-machine', cod: 'C24', nome: 'Esta máquina', sub: 'A telemetria do Mac, medida pelo núcleo daqui: CPU, memória, disco, rede, processos do Claude, sessões, o túnel com o estado de cada porta encaminhada, as portas em escuta e o que pede atenção. Em 1100 e 1440.', html: () => `<div class="fila">${bothWidths(w => frameAt(w, 'machine-local', thisMachineScreen(w)))}</div>`,
    n: N(['Do painel de telemetria antigo: os números da máquina, a lista de conexões ssh com as portas, os quatro estados da porta e os seis processos que mais usam CPU.', 'Do CCAM: o cabeçalho, os StatCards e as tabelas.'], ['Quem mede é o núcleo, não um LaunchAgent em Python nem o app: a telemetria existe para a janela, o artefato e o MCP.', 'GPU, energia, logins de nuvem e as pastas de sessão por organização ficaram de fora: os três últimos dependem de uma infraestrutura específica.', 'A coluna "O que é" de cada porta encaminhada vem do núcleo de lá, que sabe quem escuta.']) },
  { id: 'console-workstation', cod: 'C25', nome: 'Workstation', sub: 'A mesma tela para a máquina remota, lida do núcleo de lá pela porta que o túnel encaminha: carga contra os vCPUs, volumes, Docker com o recuperável, stacks com a sessão dona, as sessões do Claude de lá e as portas, com a porta do Mac que encaminha cada uma.', html: () => `<div class="fila">${bothWidths(w => frameAt(w, 'machine-ws', workstationScreen(w)))}</div>`,
    n: N(['Do console da workstation antigo: volumes, recursos, Docker em uso e recuperável, stacks e a sessão dona, sessões do Claude lá, portas em escuta por interface e "o que pede atenção".'], ['Lido ao vivo do núcleo de lá, a cada 30 s; o antigo era escrito à mão a cada medição.', 'Fora: faturamento e créditos de nuvem (pedem credencial de uma conta), perfis de nuvem e worktrees (ficam para uma issue própria).', 'O nome da máquina e a porta vêm de ~/.ahrena-console/machines.json; nada aponta para uma máquina por padrão.']) },
  { id: 'console-workstation-offline', cod: 'C26', nome: 'Workstation sem conexão, e os outros estados', sub: 'Túnel caído: a faixa diz o que o núcleo viu e a tela mostra a última leitura, desbotada. Ao lado, o túnel de pé com o núcleo de lá parado, nenhuma máquina configurada e versão diferente.', html: () => `<div class="fila"><div class="width-col"><div class="rotulo">1100 px</div>${frameAt(1100, 'machine-ws', workstationOfflineScreen(), 'off')}</div><div class="width-col"><div class="rotulo">1100 px</div>${frameAt(1100, 'machine-ws', machineStatesScreen(), 'off')}</div></div>`,
    n: N(['Os três estados do C19 (carregando, vazio e erro).', 'Do painel antigo: "Sem ligação com esta máquina" com o diagnóstico logo abaixo.'], ['Sem botão de subir o núcleo de lá. O túnel continua seu; Reconectar só aparece com o comando que você escreveu no machines.json (C50).', 'A última leitura fica no SQLite do Mac, então a tela abre com ela e diz a idade.']) },
  { id: 'console-workstation-reconnect', cod: 'C50', nome: 'Reconectar a Workstation', sub: 'Feature Reconectar a máquina remota (#244, decisão 0012): o console roda o comando de reconexão que você escreveu no machines.json. Os seis estados: com reconexão configurada (1, em 1100 e 1440), reconectando (2), reconectada (3), falhou (4), sem reconexão configurada (5) e já reconectando pela bandeja (6). A última leitura aparece cortada embaixo; é a mesma da C25.', html: () => reconnectScreens(),
    n: N(['Do painel de telemetria antigo: "Sem ligação com esta máquina" com o diagnóstico logo abaixo, como na C26.'], ['O console não sabe montar túnel nem fazer login: roda a lista do arquivo, sem shell, e só ela.', 'A saída do comando fica no log da instalação, nunca na tela (variante A); a B está desenhada para o dono escolher.', 'Um por vez por máquina, com tempo limite e Cancelar.']) },
  { id: 'console-workstation-connection', cod: 'C62', nome: 'Workstation · a conexão no ar', sub: 'Feature A conexão da máquina remota (#278, decisão 0013). O túnel vira uma conexão de primeira classe da máquina: o card Conexão (túnel, a sessão AWS que ele exige e o núcleo de lá, as portas, os comandos do machines.json) e o card Onde roda (provedor, tipo, região, lidos pelo núcleo de lá), no topo da C25. Em 1100 e 1440.', html: () => `<div class="fila">${bothWidths(w => clFrame(w, 'machine-ws', mcUpScreen(w), 'ok', 'ok'))}</div>`,
    n: N(['Nada: o CCAM não conhece túnel nem nuvem.'], ['O estado vem do que o núcleo já lê (o processo ssh e a sonda de cada porta, C24), do núcleo de lá e do perfil vinculado em Conexões › AWS; nenhum comando novo de sonda.', 'Reconectar e Parar rodam só os comandos do machines.json (connection.start e connection.stop), como o reconnect da 0012.', 'O cabeçalho ganha o provedor e a região do card Onde roda.', 'Em 1100 o Onde roda vira uma linha inteira, com os campos lado a lado: dois cards curtos lado a lado deixariam o da Conexão alto e o outro vazio (regra 9).']) },
  { id: 'console-workstation-sso-expired', cod: 'C63', nome: 'Workstation · túnel fora, SSO expirado', sub: 'De manhã: a sessão SSO expirou de noite e o túnel caiu junto. A faixa diz o motivo em palavras simples e oferece um clique só, Entrar na AWS e subir o túnel; Só entrar fica ao lado. O card Conexão mostra os três lados fora e o Onde roda fica com a última leitura. Em 1100 e 1440.', html: () => `<div class="fila">${bothWidths(w => clFrame(w, 'machine-ws', mcDownScreen(w), 'off', 'err'))}</div>`,
    n: N(['Nada.'], ['O motivo vem do conector: o perfil vinculado (cloudProfile) está expirado. Não é preciso rodar nada para saber.', 'A linha mono mostra os dois comandos antes do clique: o login fixo da aws CLI e o connection.start do arquivo.', 'Pergunta 3 da 0013: um clique para os dois (recomendado), ou dois botões.']) },
  { id: 'console-workstation-connection-states', cod: 'C64', nome: 'Workstation · subindo, parando e parada', sub: 'O andamento do clique da C63 (entrando na AWS, depois subindo o túnel), a confirmação de Parar o túnel e o estado parado por você, que não é queda. Em 1100.', html: () => mcStatesScreens(), n: '' },
  { id: 'console-workstation-connection-failing', cod: 'C65', nome: 'Workstation · por que caiu, e sem connection', sub: 'O aviso antes da queda (a sessão expira em 14 min), os motivos de uma falha em palavras simples, cada um com de onde veio e a ação certa, e a máquina que só tem o reconnect da #244, com o Onde roda desconhecido. Em 1100.', html: () => mcFailScreens(), n: '' },
  { id: 'console-this-machine-cloud-profiles', cod: 'C66', nome: 'Esta máquina · Perfis de nuvem', sub: 'Feature Contas de nuvem (#277). Os perfis de nuvem são de cada máquina: a tela Esta máquina ganha o card Perfis de nuvem, com as sessões deste Mac, o estado e Entrar ali mesmo. O link leva a Conexões, que é a visão de todas as máquinas. Em 1100 e 1440.', html: () => `<div class="fila">${bothWidths(w => clFrame(w, 'machine-local', thisMachineProfiles(w), 'ok', 'err'))}</div>`,
    n: N(['Nada.'], ['O mesmo dado de Conexões › AWS com o seletor em Este Mac (C58): os dois lugares leem o mesmo estado do núcleo daqui, e Entrar num muda o outro sem recarregar.', 'O chip diz que o túnel da Workstation depende desta sessão.']) },
  { id: 'console-workstation-cloud-profiles', cod: 'C67', nome: 'Workstation · Perfis de nuvem', sub: 'Os perfis da própria Workstation, lidos pelo núcleo de lá. Entrar inicia a sessão lá: a aws CLI de lá roda o login por código, e o código aparece aqui para você confirmar no navegador deste Mac. Sem esse login lá, a tela mostra o comando. Em 1100 e 1440.', html: () => cpScreens(), n: '' },
  { id: 'console-dev-console', cod: 'C27', nome: 'Dev Console', sub: 'O placar de um contexto (um conjunto de repositórios): prontos para você, CI rodando, CI vermelho, sessões trabalhando e quem precisa de você; a fila de merge na ordem; o quadro das issues em seis colunas e o que foi mesclado. Em 1440 as seis colunas lado a lado; em 1100, quatro e duas embaixo, para nada rolar na horizontal.', html: () => `<div class="fila">${bothWidths(w => frameAt(w, 'dev', devConsoleScreen(w)))}</div>`,
    n: N(['Do Dev Console antigo: o seletor de contexto, a aba Fila de merge com todos os contextos, o placar de 5 números, "Depende de você", a fila na ordem de merge com os não prontos fechados, o quadro de 6 colunas com o critério de cada uma, e "mesclados nas últimas 24 h".'], ['Derivado no núcleo, sem sessão de PM gravando estado: "Delegada" é uma sessão aberta no branch da issue sem push, e "Depende de você" vem de /api/atencao e das decisões sugeridas.', '"Bloqueada" é a etiqueta blocked da issue; plano em andamento e a trilha da release ficaram de fora, porque dependiam de anotação.', 'O antigo rolava na horizontal (o quadro tinha 1110 px mínimos); aqui o quadro dobra em 1100.']) },
  { id: 'console-adrs', cod: 'C28', nome: 'ADR · decisões de arquitetura', sub: 'Os registros de decisão (ADRs) de todos os repositórios da conta, por repositório, com busca no texto e filtro por status. Em 1100 (a janela do app) e 1440.', html: () => `<div style="display:flex;flex-direction:column;gap:12px"><div class="rotulo">1100 px</div>${frameAt(1100, 'adrs', telaAdrs(false))}<div class="rotulo">1440 px</div>${frameAt(1440, 'adrs', telaAdrs(true))}</div>`,
    n: N(['A lista agrupada do Histórico e de Decisões (C21), os StatCards e os filtros de Sessões.'], ['O CCAM não lê ADRs. A tela lê as pastas de ADR que a varredura de Repositórios (C22) já conhece, com o cache da decisão 0001.', 'Em 1440 a linha ganha a coluna das ligações e do que falta; em 1100 isso desce para baixo do título.', 'Repositórios sem ADR ficam numa linha só, no fim, com as pastas procuradas.']) },
  { id: 'console-repo-adrs', cod: 'C29', nome: 'Repositório · ADRs', sub: 'A aba ADRs na tela de um repositório (C23), com o seletor ADR · PDR · Todas no topo: a lista do repositório, onde foi lida e a cadeia de substituições. Em 1100.', html: () => `<div class="fila">${frameAt(1100, 'repos', telaRepoAdrs())}</div>`,
    n: N(['O cabeçalho e as abas do Session Detail, como em C23.'], ['A aba fica ao lado de Decisões: Decisões são as das sessões (C20 e C21); ADRs são os registros que estão no repositório.', 'A cadeia mostra quem substituiu quem, inclusive quando só um dos lados escreveu a ligação.']) },
  { id: 'console-adr', cod: 'C30', nome: 'ADR aberta', sub: 'Uma ADR estruturada: cabeçalho com status e data, as ligações, contexto, decisão com a opção escolhida, alternativas, consequências boas e ruins, e os metadados. Em 1100 e 1440.', html: () => `<div style="display:flex;flex-direction:column;gap:12px"><div class="rotulo">1100 px</div>${frameAt(1100, 'adrs', telaAdr(false))}<div class="rotulo">1440 px</div>${frameAt(1440, 'adrs', telaAdr(true))}</div>`,
    n: N(['O cabeçalho com chips do Session Detail e a coluna lateral de Decisões (C20).'], ['"Markdown" troca para o texto do arquivo, para quando o extrator errar; o padrão é a estruturada.', 'Seções que o extrator não reconhece ficam em "Outras seções do texto", fechadas, e nada do arquivo some.', 'MADR 4 traz decisores, consultados e informados; Nygard e os livres mostram só o que tiverem.']) },
  { id: 'console-adrs-states', cod: 'C31', nome: 'ADRs · estados', sub: 'Feature ADRs (#174), aba ADRs do repositório: o GitHub limitando (o cache com a hora dele), um repositório sem ADR e uma ADR incompleta. Mesmo molde dos estados de Instruções (C33). Em 1100 e 1440.', html: () => `<div style="display:flex;flex-direction:column;gap:12px"><div class="rotulo">1100 px</div>${frameAt(1100, 'repos', telaAdrsEstados())}<div class="rotulo">1440 px</div>${frameAt(1440, 'repos', telaAdrsEstados())}</div>`,
    n: N(['EmptyState e a faixa de C19.'], ['Um molde só para os estados das abas ADRs e Instruções: faixa no topo, o vazio à esquerda, o item com partes faltando à direita, em linhas tracejadas.', 'O que falta na ADR aparece tracejado, "não está no texto", em vez de sumir: quem lê sabe que o autor não escreveu.']) },
  { id: 'console-repo-instr', cod: 'C32', nome: 'Repositório · Instruções dos agentes', sub: 'A aba Instruções na tela de um repositório: os arquivos de instrução (CLAUDE.md e AGENTS.md da raiz e das subpastas), cada um renderizado com os @imports abertos no lugar, e o que .claude/ traz (regras, skills, agentes, hooks, plugins habilitados e MCP). Em 1100 e 1440.', html: () => `<div style="display:flex;flex-direction:column;gap:12px"><div class="rotulo">1100 px</div>${frameAt(1100, 'repos', telaRepoInstr(false))}<div class="rotulo">1440 px</div>${frameAt(1440, 'repos', telaRepoInstr(true))}</div>`,
    n: N(['A lista e o editor do Agent Config (C16 e C17), que lê o .claude/ desta máquina; aqui o mesmo conteúdo vem do repositório, pelo GitHub, e só se lê.'], ['A aba se chama "Instruções" para caber em 1100 ao lado de ADRs; o título "Instruções dos agentes" fica no índice.', 'O @import abre no lugar, com a borda laranja; o que fica fora do repositório (@~/…) é dito, não escondido.', 'Hooks mostram o evento, o matcher e quantos comandos; nunca o comando, como o Agent Config.', 'Em 1440, o que .claude/ traz vai para uma coluna à direita; em 1100, desce para baixo do arquivo.']) },
  { id: 'console-repo-instr-states', cod: 'C33', nome: 'Instruções · estados', sub: 'Feature Instruções dos agentes (#183), aba Instruções do repositório: a árvore cortada pelo GitHub, um repositório sem nenhuma instrução (com Instalar, da #184) e instruções com avisos. Mesmo molde dos estados de ADRs (C31). Em 1100 e 1440.', html: () => `<div style="display:flex;flex-direction:column;gap:12px"><div class="rotulo">1100 px</div>${frameAt(1100, 'repos', telaInstrEstados())}<div class="rotulo">1440 px</div>${frameAt(1440, 'repos', telaInstrEstados())}</div>`,
    n: N(['EmptyState e a faixa de C19.'], ['O mesmo molde de ADRs · estados (C31).', 'O vazio diz onde procuramos e o que o agente leva no lugar, e oferece Instalar.', 'O aviso "nenhum CLAUDE.md importa este AGENTS.md" só aparece sem o import.']) },
  { id: 'console-install-start', cod: 'C34', nome: 'Instruções · sem Ahrena Framework', sub: 'A aba Instruções de um repositório que tem instruções, mas não o framework: o card com Instalar fica no topo, e o que existe continua embaixo.', html: () => `<div class="fila">${frameAt(1100, 'repos', telaSemFramework())}</div>`,
    n: N(['A aba Instruções (C32).'], ['Instalar só aparece para quem pode escrever no repositório (permissão lida pela tela Repositórios); sem ela, o card diz por quê (C37).']) },
  { id: 'console-install-choose', cod: 'C35', nome: 'Instalar · plataformas e plugins', sub: 'Passo 1: o que achamos no repositório, as plataformas (Claude Code completo, Codex pelo AGENTS.md, Cursor a confirmar) e os plugins, com a base sempre, os sugeridos pelo que o repositório tem e os outros desmarcados. Em 1100.', html: () => `<div class="fila">${frameAt(1100, 'repos', telaInstalarEscolha())}</div>`,
    n: N(['Do instalador antigo: escolher a plataforma. Lá era manual (PLATFORM= e --clades); aqui os plugins vêm sugeridos pelo que o repositório tem, e a pessoa ajusta.'], ['A base (foundation, contributing, fundamentals) não desmarca: os outros dependem dela.', 'Cada sugestão diz o motivo: "achamos pyproject.toml".', 'Claude Code completo; Codex só pelo AGENTS.md; Cursor desabilitado e marcado "a confirmar" (decidido em 20/10).']) },
  { id: 'console-install-preview', cod: 'C36', nome: 'Instalar · prévia do diff', sub: 'Passo 2: cada arquivo com a ação (criar ou mesclar) e o diff; o que já existia fica. Nada foi escrito ainda. Em 1100 e 1440.', html: () => `<div style="display:flex;flex-direction:column;gap:12px"><div class="rotulo">1100 px</div>${frameAt(1100, 'repos', telaInstalarPrevia(false))}<div class="rotulo">1440 px</div>${frameAt(1440, 'repos', telaInstalarPrevia(true))}</div>`,
    n: N(['O diff do GitHub, unificado ou lado a lado.'], ['Os números são os do planejador do spike sobre estes arquivos: AGENTS.md +21, CLAUDE.md +4, settings.json +15.', 'O campo de issue é opcional: vazio, o PR sai sem referência.', 'Mesclar nunca apaga: no exemplo, a permissão que já existia continua.', 'O PR sai num branch novo, com um commit; o main não é tocado.']) },
  { id: 'console-install-pr', cod: 'C37', nome: 'Instalar · PR aberto e o que impede', sub: 'Passo 3: o PR aberto, com CI e review, ao vivo. Embaixo, os dois casos em que o PR não sai: um settings.json quebrado e a falta de permissão de escrita. Em 1100.', html: () => `<div class="fila">${frameAt(1100, 'repos', telaInstalarPr())}</div>`,
    n: N(['O cabeçalho de PR do Kanban do projeto (C11): estado, CI e review.'], ['JSON quebrado não vira {} como no instalador antigo: o PR não sai e nada é escrito.']) },
  { id: 'console-pdrs', cod: 'C38', nome: 'PDR · decisões de produto', sub: 'A irmã de ADR (C28): as decisões de produto dos repositórios, com a mesma lista, a mesma busca e o mesmo filtro por status. Vêm de pastas só de PDR (docs/product-decisions) e das pastas mistas, pelo campo Tipo. A PDR aberta é a C30, com outro rótulo. Em 1100 e 1440.', html: () => `<div style="display:flex;flex-direction:column;gap:12px"><div class="rotulo">1100 px</div>${frameAt(1100, 'pdrs', telaPdrs(false))}<div class="rotulo">1440 px</div>${frameAt(1440, 'pdrs', telaPdrs(true))}</div>`,
    n: N(['A tela de ADR (C28), inteira: a mesma função desenha as duas.'], ['No grupo Decisões da barra ficam três itens: Das sessões (C20 e C21), ADR e PDR.', 'Numa pasta mista, como docs/decisoes, o campo Tipo separa: a linha do grupo diz isso.', 'Sem nenhum sinal, o registro fica como ADR.']) },
  { id: 'console-session-message', cod: 'C51', nome: 'Detalhe · Mandar mensagem', sub: 'Issue #61. A Conversa (C5) de uma sessão do Claude Desktop ociosa, com processo vivo nesta máquina, e a caixa de mensagem embaixo: para quem vai (sessão, Claude Desktop, conta), o texto, Enviar (⌘↵) e o aviso de que chega como mensagem de outra sessão. /compact e /clear aparecem desligados: dependem do mod. A sessão está com o Remote Control ligado (chip na linha Para). Embaixo, a variante de uma sessão que pede permissão, com o Remote Control desligado: o botão Remote control aparece desligado, pelo mesmo motivo. Em 1100 e 1440.', html: () => `<div style="display:flex;flex-direction:column;gap:12px">${widthCol(1100, '1100 px · sessão ociosa', frameAt(1100, 'sessoes', sessionMessageScreen()))}${widthCol(1440, '1440 px · sessão ociosa', frameAt(1440, 'sessoes', sessionMessageScreen()))}${widthCol(1100, '1100 px · variante: a sessão pede permissão', frameAt(1100, 'sessoes', sessionMessagePermissionScreen()))}</div>`,
    n: N(['A aba Conversation do Session Detail (C5): seletor de agente, mensagens com modelo e tokens, blocos de ferramenta.', 'O cabeçalho do Session Detail com os chips; a faixa amarela de waiting na variante.'], ['O CCAM só lê; aqui a Conversa ganha a caixa de mensagem, como o Podium. Ela fica no pé da aba Conversa, onde a resposta vai aparecer; as outras abas não têm caixa.', 'Entrega pela caixa de entrada da mensageria entre sessões do Claude Code, só para a sessão escolhida (o mesmo <code>sessionId</code>, processo vivo, socket do próprio usuário). Vale para o Claude Desktop e para o <code>claude</code> no terminal.', 'A linha "Para" diz a sessão, onde ela roda e a conta, para ninguém mandar na sessão errada.', '"De outra sessão" está escrito na caixa: a mensagem não aprova permissão, não roda comando e não muda configuração.', '/compact, /clear e Remote control ficam visíveis e desligados, com "dependem do mod": pela caixa de entrada os comandos chegariam como texto, e ligar o Remote Control é coisa do mod. Ligam quando o mod rodar a ordem (fora desta issue).', 'Remote Control: com ele ligado na sessão, a linha "Para" ganha o chip "Remote Control ligado" e o botão some; com ele desligado (a variante), o botão Remote control aparece desligado.', 'Na variante, a caixa avisa que a mensagem não responde à permissão: permitir continua no Claude Desktop.', 'Ícones reaproveitados de <code>ui/dom.js</code> (your-turn no Enviar, lock, info, shield, monitor, live no Remote Control); nenhum desenho novo.']) },
  { id: 'console-session-message-states', cod: 'C52', nome: 'Mandar mensagem · estados da entrega', sub: 'Issue #61. Os quatro estados depois de Enviar: Enviando…; Entregue, confirmado quando a sessão começa um turno novo, com a hora; Enviada, sem confirmação, depois de 60 s; e Não entregue, com o motivo e Tentar de novo. Embaixo, como a mensagem aparece na Conversa. Em 1100 e 1440.', html: () => `<div style="display:flex;flex-direction:column;gap:12px">${widthCol(1100, '1100 px', frameAt(1100, 'sessoes', sessionMessageStatesScreen()))}${widthCol(1440, '1440 px', frameAt(1440, 'sessoes', sessionMessageStatesScreen()))}</div>`,
    n: N(['Os estados de carregamento e de erro inline do C19, e o bloco de ferramenta "Rodando" da Conversa.'], ['O socket não responde nada: "Entregue" só vale quando o transcript mostra um turno novo depois do envio. Falha de conexão é "Não entregue" na hora.', 'Sem turno novo em 60 s, "Enviada, sem confirmação": a sessão pode estar segurando pela política de mensagens entre sessões. Não oferece reenviar, porque duplicaria.', 'O texto digitado só vive na caixa: na falha ele fica lá para tentar de novo; nunca volta de um log (a auditoria guarda o SHA-256, não o texto).', 'Na Conversa, a mensagem vem do próprio transcript, com a marca "de outra sessão · pelo console".']) },
  { id: 'console-session-message-unavailable', cod: 'C53', nome: 'Mandar mensagem · quando não dá', sub: 'Issue #61. Os casos em que a caixa fica desligada e diz por quê: sessão sem processo vivo (com Abrir no Claude Desktop), sessão em outra máquina e mais de um processo dizendo ser a mesma sessão. Embaixo, "precisam de você" no Dashboard e as linhas de Sessões com a ação Mandar mensagem, que abre o Detalhe na Conversa com a caixa em foco. Em 1100 e 1440.', html: () => `<div style="display:flex;flex-direction:column;gap:12px">${widthCol(1100, '1100 px', frameAt(1100, 'sessoes', sessionMessageUnavailableScreen(1100)))}${widthCol(1440, '1440 px', frameAt(1440, 'sessoes', sessionMessageUnavailableScreen(1440)))}</div>`,
    n: N(['O EmptyState com motivo e ação (C19).', 'O inbox "precisam de você" do Dashboard (C1) e a tabela de Sessões (C3).'], ['A caixa desligada fica no lugar, tracejada, com o motivo: quem procura o botão descobre por que não dá.', 'Sessão sem processo vivo não tem para onde entregar sem o núcleo retomar (9.8); a saída é abrir no Claude Desktop.', 'Outra máquina: a caixa fica desligada. A entrega pelo núcleo de lá é o #282; o Remote Control não serve, porque só uma sessão do Claude logada manda mensagem por ele.', 'Mais de um processo com o mesmo <code>sessionId</code> é recusa: entregar no errado é pior que não entregar.', '"Mandar mensagem" aparece só onde há um processo vivo aqui; numa sessão com erro sem processo, a linha diz "sem processo vivo". É um atalho para o Detalhe: nada é enviado da lista.']) },
  { id: 'console-connections-catalog', cod: 'C57', nome: 'Conexões · o catálogo de conectores', sub: 'Feature Contas de nuvem (#277, decisão 0013). A seção Conexões da #241 vira um catálogo: um conector por conta de fora (GitHub, AWS, depois Google Cloud e Azure), cada um com o seu estado, e um lugar só para entrar. A AWS tem uma sessão expirada, com Entrar no próprio card. Em 1100 e 1440.', html: () => `<div class="fila">${bothWidths(w => clFrame(w, 'connections', connectionsCatalog(w), 'ok', 'err'))}</div>`,
    n: N(['Nada: o CCAM não entra em conta nenhuma.'], ['Por que em Conexões, e não numa seção Nuvens: hoje são contas, perfis e sessão, o mesmo assunto e o mesmo modelo de segurança do GitHub (entrar numa conta de fora). Quando vier informação da nuvem (instâncias, custo), ela ganha item em Máquinas; entrar continua aqui.', 'O ponto de Conexões na barra resume o pior estado; o pé da barra diz qual.', 'Catálogo fixo no código: "Adicionar" liga a leitura de um conector, não instala nada de fora.']) },
  { id: 'console-aws-profiles', cod: 'C58', nome: 'Conexões · AWS, sessões e perfis', sub: 'Os perfis do ~/.aws/config agrupados pela sso-session: um login vale para todos os perfis da sessão. Por sessão: o estado (válida até, expirada há), Entrar, e os perfis com conta, papel, região e quem usa (a Workstation). Perfis com chave de acesso ficam fora do escopo. Em 1100 e 1440.', html: () => `<div class="fila">${bothWidths(w => clFrame(w, 'connections', awsProfilesScreen(w), 'ok', 'err'))}</div>`,
    n: N(['Nada.'], ['Agrupar pela sso-session é o que a aws CLI faz: o aws sso login vale para a sessão, e a tela diz isso no pé do card.', 'Válida ou não vem do aws sts get-caller-identity a cada 5 min; a hora do fim vem do cache da CLI, só o expiresAt (pergunta 1 da 0013, variante A). Na variante B, a linha vira "entrou às 10:40, há 3 h".', 'O console nunca abre o ~/.aws/credentials.', 'As sessões ficam uma embaixo da outra também em 1440: lado a lado, a tabela de perfis não cabe sem rolar (regra 2).']) },
  { id: 'console-aws-login', cod: 'C59', nome: 'Conexões · AWS, entrando', sub: 'Depois de Entrar: o núcleo roda o login da aws CLI, que abre o navegador, e a tela espera com o tempo contra o limite e Cancelar. Ao terminar, os três perfis da sessão ficam válidos. Se o login não terminar, o console encerra a CLI e diz isso, sem mostrar a saída. Em 1100.', html: () => `<div class="tm-rc">
      ${rcRow([['1 · aguardando o navegador · 1100 px', clFrame(1100, 'connections', awsLoginScreen(SESS_RUNNING), 'ok', 'err')], ['2 · entrou · 1100 px', clFrame(1100, 'connections', awsLoginScreen(SESS_DONE), 'ok', 'ok')]], [
        'O comando é um <b>modelo fixo no código</b>: aws sso login --sso-session &lt;nome&gt;. O nome vem do ~/.aws/config que o núcleo acabou de ler, não do pedido; a rota recebe só o nome e confere que ele está no arquivo.',
        'Sem shell, um por sessão de cada vez, até 5 min, saída no log da instalação (0012).',
        'O núcleo não vê o navegador: "aguardando o navegador" é o tempo em que a CLI espera.',
        'Ao sair com 0, o núcleo confere a sessão na hora; a Workstation, que usa o perfil-dev, sabe que já pode subir o túnel.'])}
      ${rcRow([['3 · o login não terminou · 1100 px', clFrame(1100, 'connections', awsLoginScreen(SESS_FAILED), 'ok', 'err')]], [
        'Passou do tempo ou Cancelar: o console encerra o processo e a sessão continua expirada.',
        'Como na 0012, a tela diz o que houve e onde está o log; a saída de um login tem conta e URL e não vem para a /ui.'])}
    </div>`, n: '' },
  { id: 'console-clouds-states', cod: 'C60', nome: 'Conexões · sem nuvem, e os estados da AWS', sub: 'Sem nenhuma nuvem configurada: o card da AWS diz como criar um perfil com SSO, sem apontar para conta de ninguém (regra 5). Embaixo, o que não é o caminho feliz: sem a aws CLI, a v1, o ~/.aws/config com erro, um nome que não vai para a linha de comando, o estado desconhecido e o login que não terminou. Em 1100.', html: () => `<div style="display:flex;flex-direction:column;gap:12px"><div class="width-col"><div class="rotulo">1100 px · nenhuma nuvem configurada</div>${clFrame(1100, 'connections', connectionsNoCloud(), 'ok', 'none')}</div><div class="width-col"><div class="rotulo">1100 px · os estados da AWS</div>${clFrame(1100, 'connections', awsStatesScreen(), 'ok', 'warn')}</div></div>`,
    n: N(['Nada.'], ['Nenhum botão morto: sem CLI, sem perfil ou com o arquivo inválido, Entrar não aparece e o card diz o que fazer.', 'O nome que vai para a linha da aws passa por um padrão estreito; fora dele, o perfil aparece sem Entrar.']) },
  { id: 'console-multi-cloud', cod: 'C61', nome: 'Conexões · várias nuvens', sub: 'Com AWS e Google Cloud (fase 2) conectados: um card por conector e a lista de todas as sessões de nuvem de todas as máquinas (este Mac e a Workstation), a mais perto de expirar primeiro, com a ação de cada uma. É aqui que as telas de cada máquina (C66, C67) se juntam. Em 1100 e 1440.', html: () => `<div class="fila">${bothWidths(w => clFrame(w, 'connections', multiCloudScreen(w), 'ok', 'warn'))}</div>`,
    n: N(['Nada.'], ['O mesmo molde para toda nuvem: a configuração da CLI dela (perfis da aws, configurações do gcloud, assinaturas do az), o estado da sessão e o login da CLI.', 'A lista junta as nuvens para responder "o que vai expirar"; o detalhe de cada uma continua no card dela.', 'Google Cloud e Azure são fases seguintes; o desenho mostra que cabem sem mudar a tela.']) },
  { id: 'console-connections-off', cod: 'C39', nome: 'Conexões · desconectado', sub: 'Feature Conectar ao GitHub (#241, decisão 0011). A seção nova de Controle: o GitHub sem conexão, os escopos que o console vai pedir e por quê, onde a credencial vai ficar e a fonte (o console, ou o gh para quem já usa). Em 1100 e 1440.', html: () => `<div class="fila">${bothWidths(w => frameGh(w, 'connections', connectionsOffScreen(w), 'off'))}</div>`,
    n: N(['Nada: o CCAM lê o GitHub com o gh da máquina.'], ['O console conecta sozinho, pelo device flow do OAuth App da Ahrena: o app instalado não depende do gh.', 'A barra ganha Conexões em Controle; o pé da barra diz se o GitHub está conectado.', 'Os escopos aparecem antes de conectar, cada um com o motivo.']) },
  { id: 'console-connections-pending', cod: 'C40', nome: 'Conexões · o código do device flow', sub: 'Depois de Conectar: o código de 8 letras, o botão que abre github.com/login/device no navegador e a espera, que muda sozinha quando a pessoa autoriza. O código vale 15 minutos. Em 1100 e 1440.', html: () => `<div class="fila">${bothWidths(w => frameGh(w, 'connections', connectionsPendingScreen(w), 'pending'))}</div>`,
    n: N(['—'], ['Quem pede o token ao GitHub é o núcleo; a /ui só mostra o código e acompanha o estado. O device_code nunca sai do núcleo.', 'Só a própria /ui começa o fluxo (Origin da mesma origem, decisão 0003): nenhum agente conecta pela pessoa.']) },
  { id: 'console-connections-on', cod: 'C41', nome: 'Conexões · conectado', sub: 'Conectado como dev-sintetico: os escopos concedidos, as organizações (uma bloqueia o aplicativo, com o link para pedir aprovação), o limite da API, o Keychain e as telas que voltaram a funcionar. Em 1440, a confirmação de Desconectar, com o link para revogar no GitHub. Em 1100 e 1440.', html: () => `<div class="fila">${bothWidths(w => frameGh(w, 'connections', connectionsOnScreen(w), 'on'))}</div>`,
    n: N(['—'], ['Desconectar apaga a entrada do Keychain e o cache do GitHub; revogar o aplicativo é no github.com, porque o console não tem o client secret.', 'Reconectar é o mesmo device flow, para quando falta um escopo.']) },
  { id: 'console-connect-github', cod: 'C42', nome: 'Conectar ao GitHub nas telas', sub: 'Repositórios, Kanban do projeto, Dev Console e a aba Instruções sem conexão: o mesmo vazio, que diz o que a tela faria e leva a Conexões já com o código. Repositórios e Dev Console em 1100; Kanban do projeto e Instruções em 1440.', html: () => `<div style="display:flex;flex-direction:column;gap:12px"><div class="fila"><div class="width-col"><div class="rotulo">1100 px · Repositórios</div>${frameGh(1100, 'repos', connectRepos(), 'off')}</div><div class="width-col"><div class="rotulo">1100 px · Dev Console</div>${frameGh(1100, 'dev', connectDev(), 'off')}</div></div><div class="width-col"><div class="rotulo">1440 px · Kanban do projeto</div>${frameGh(1440, 'projeto', connectProject(), 'off')}</div><div class="width-col"><div class="rotulo">1440 px · Repositório · Instruções</div>${frameGh(1440, 'repos', connectInstr(), 'off')}</div></div>`,
    n: N(['—'], ['Hoje essas telas mandam rodar gh auth login. Agora o vazio é um só, com um botão.', 'As ADRs e PDRs usam o mesmo vazio; as abas do repositório que não dependem do GitHub (Sessões, Decisões) continuam.']) },
  { id: 'console-project-picker', cod: 'C43', nome: 'Kanban do projeto · escolher o Project', sub: 'Sem AHRENA_CONSOLE_PROJECT: a lista dos Projects que a conta enxerga (seus e das organizações), com busca, o campo que vira colunas e Usar. Em 1440, o quadro com Trocar de Project aberto no cabeçalho. Em 1100 e 1440.', html: () => `<div style="display:flex;flex-direction:column;gap:12px"><div class="rotulo">1100 px</div>${frameGh(1100, 'projeto', projectPickerScreen())}<div class="rotulo">1440 px</div>${frameGh(1440, 'projeto', projectSwitchScreen())}</div>`,
    n: N(['O quadro do Kanban do projeto (C11).'], ['A escolha fica nas preferências da instalação, sem variável de ambiente; nada aponta para o Project da Ahrena.', 'Um Project sem campo de seleção não vira quadro: a linha diz isso.']) },
  { id: 'console-connections-states', cod: 'C44', nome: 'Conexões · estados', sub: 'O que não é o caminho feliz: o console sem o aplicativo do GitHub configurado, a máquina sem cofre, um escopo faltando e o código expirado ou recusado. Embaixo, as faixas da fonte gh e de AHRENA_CONSOLE_PROJECT definida (esta no Kanban do projeto). Em 1100.', html: () => `<div class="fila">${frameGh(1100, 'connections', connectionsStatesScreen(), 'off')}</div>`,
    n: N(['—'], ['Sem cofre o console não conecta: a credencial nunca vai para arquivo.', 'Sem o aplicativo configurado, Conectar fica desligado e a tela diz por quê; nada aponta para um aplicativo de outra pessoa.']) },
  { id: 'console-open-detail', cod: 'C70', nome: 'Detalhe · Abrir a sessão', sub: 'O cabeçalho do Detalhe ganha, ao lado de Atualizar, o botão que leva à própria sessão, precise ela de você ou não. O rótulo diz o alvo: <b>Abrir no Claude Desktop</b> para a sessão que o Desktop conhece; <b>Abrir no terminal</b> para a do <code>claude</code> no terminal, que abre o terminal padrão retomando a sessão na pasta dela. Embaixo, os quatro casos (Desktop, terminal, terminal ainda rodando, outra máquina com o botão desligado) e o que aparece depois do clique. Em 1100 e 1440.', html: () => `<div style="display:flex;flex-direction:column;gap:12px">${osCol('1100 px · sessão do Claude Desktop, ociosa', frameAt(1100, 'sessoes', openDetailScreen()))}${osCol('1100 px · os casos', frameAt(1100, 'sessoes', openDetailCasesScreen()))}${osCol('1440 px', frameAt(1440, 'sessoes', openDetailScreen()))}</div>`,
    n: N(['O cabeçalho do Session Detail com os chips (C5); o "Abrir no Claude Desktop" que já existe na faixa e na linha de ociosa.'], ['O botão sai da faixa e da linha de ociosa e vai para o cabeçalho, sempre no mesmo lugar, inclusive em sessão ativa ou concluída.', 'O alvo vem do núcleo: sessão no índice do Claude Desktop (tem <code>local_…</code>) abre lá pelo <code>/open/&lt;local_…&gt;</code> que o mod e a bandeja já usam; sessão só com transcript retoma no terminal.', 'Terminal: o núcleo monta <code>claude --resume &lt;id&gt;</code> na pasta da sessão, com o id e a pasta que ele mesmo leu, nunca com texto da tela. No macOS abre no app de terminal padrão; no Linux e no Windows, o terminal conhecido, senão Copiar comando.', 'Terminal com o <code>claude</code> ainda rodando: retomar abriria uma segunda cópia da mesma sessão. A proposta é <b>Ir para o terminal</b> (traz à frente a janela do Terminal ou do iTerm2 que tem o processo), e Copiar comando quando não achar.', 'Outra máquina: desligado, com "roda em ws-exemplo", e Copiar comando para rodar lá.', 'POST da mesma origem (decisão 0003), como o <code>/open</code> de hoje.']) },
  { id: 'console-open-wall', cod: 'C71', nome: 'Mural, Sessões e Dashboard · Abrir a sessão', sub: 'Cada card do Mural ao vivo ganha um pé com a mesma ação do Detalhe, com o rótulo do alvo, e "Detalhe ›" ao lado. Em Sessões e no "precisam de você" do Dashboard não cabe o rótulo: vai só o ícone (monitor para o Claude Desktop, terminal para o terminal), com o título dizendo a ação. Mural em 1100 e 1440; Sessões e Dashboard em 1100.', html: () => `<div style="display:flex;flex-direction:column;gap:12px">${osCol('1100 px · Mural ao vivo', frameAt(1100, 'mural', openWallScreen()))}${osCol('1440 px · Mural ao vivo', frameAt(1440, 'mural', openWallScreen()))}${osCol('1100 px · Dashboard e Sessões', frameAt(1100, 'sessoes', openRowsScreen()))}</div>`,
    n: N(['O card do Mural (C2), a tabela de Sessões (C3) e o inbox do Dashboard (C1).'], ['No Mural o card cresce uma linha para caber o pé; os cards da mesma linha continuam com a mesma altura (regra 9).', 'O clique no botão abre a sessão; o resto do card continua levando ao Detalhe.', 'Na sessão de outra máquina o pé diz onde ela roda e oferece só Copiar comando.', 'Em Sessões o ícone toma o lugar da seta do fim da linha (a linha inteira continua levando ao Detalhe), para nada rolar na horizontal em 1100; no Dashboard o ícone fica ao lado de "Abrir ›", que segue indo ao Detalhe.']) },
  { id: 'console-tools', cod: 'C72', nome: 'Ferramentas · Esta máquina', sub: 'Feature Ferramentas (#280, decisão 0014), na seção Controle: o setup de desenvolvimento do Mac em quatro grupos. CLIs com a versão instalada, a mais recente e de onde veio; plataformas com quem gerencia cada uma; containers com o Colima e a VM; servidores MCP do Claude Code nos dois escopos, sem segredo nenhum. Cada item em dia, desatualizado, faltando, instalado à mão ou com falha. Em 1100 e 1440.', html: () => `<div class="fila">${bothWidths(w => frameAt(w, 'tools', toolsScreen(w)))}</div>`,
    n: N(['Sem tela parecida no CCAM. O molde é o das máquinas (C24): cabeçalho, números em cima e cards em grade.'], ['Um seletor de máquina no cabeçalho, em vez de um item na barra por máquina: Ferramentas é uma tela só, e a Workstation é a mesma tela lida de lá (C75).', 'Atualizar 5 junta o que roda sem senha; o aws fica de fora porque veio do instalador oficial (C74, 5).', 'O MCP mostra o nome das variáveis contadas, nunca o valor, e só o host de uma URL.', 'O uso de disco do Docker e as stacks ficam na tela da máquina: aqui só a saúde do runtime e o link.']) },
  { id: 'console-tools-install', cod: 'C73', nome: 'Ferramentas · instalar e atualizar', sub: 'O caminho de uma ação: o confirmar com o comando exato do catálogo (1, em 1100 e 1440), o Atualizar 5 com a lista inteira (1b), rodando com a saída ao vivo na linha do item e a fila (2), pronto (3) e falhou, com as últimas linhas e o log (4).', html: () => tlInstallScreens(),
    n: N(['O andamento da C50 (Reconectar): passos, tempo contra o limite e Cancelar.'], ['A saída aparece na tela, ao contrário da C50: a de um gerenciador de pacotes não traz login nem código de dispositivo. Vai também para o tools.log, com permissão só do usuário.', 'Um por vez, em fila: dois gerenciadores ao mesmo tempo disputam o PATH e o disco, e a fila deixa a ordem visível.', 'O confirmar nomeia a entrada do catálogo (gh · update · homebrew): é o que a rota recebe, nunca o texto.']) },
  { id: 'console-tools-states', cod: 'C74', nome: 'Ferramentas · estados', sub: 'Tudo em dia (1), verificando pela primeira vez, sem cache (2), sem rede, com o cache e a hora (3), macOS sem Homebrew (4), um item que precisa de sudo, aberto, com o comando para copiar (5) e Windows sem winget (6). Em 1100.', html: () => `<div class="fila">${frameAt(1100, 'tools', toolsStatesScreen())}</div>`,
    n: N(['EmptyState e a faixa de C19.'], ['O console nunca roda sudo nem pede senha: mostra o comando, com Copiar e Rodei, verificar de novo.', 'Não instala o Homebrew: o instalador pede senha. A tela diz isso e mostra o comando de brew.sh.', 'Sem a mais recente, a coluna fica vazia, nunca "em dia".']) },
  { id: 'console-tools-remote', cod: 'C75', nome: 'Ferramentas · Workstation', sub: 'A mesma tela, lida do núcleo da Workstation. Só leitura, o padrão (1100): cada ação vira Copiar comando. Com ações ligadas lá, pela própria Workstation (1440): os botões dizem "lá" e o confirmar diz quem roda. Embaixo, a Workstation sem conexão, com a última leitura desbotada.', html: () => `<div class="tl-flow"><div class="tl-step"><div class="rotulo">1 · Só leitura, o padrão · 1100 px</div>${frameAt(1100, 'tools', toolsRemoteScreen(1100, false))}</div><div class="tl-step"><div class="rotulo">2 · Ações ligadas na Workstation · 1440 px</div>${frameAt(1440, 'tools', toolsRemoteScreen(1440, true))}</div><div class="tl-step"><div class="rotulo">2b · Confirmar na Workstation · 1100 px</div>${frameAt(1100, 'tools', `<div class="tl-veil-wrap">${tlClip(toolsRemoteScreen(1100, true), 640)}${tlRemoteConfirm}</div>`)}</div><div class="tl-step"><div class="rotulo">3 · Sem conexão · 1100 px</div>${frameAt(1100, 'tools', tlRemoteOffline(), 'off')}</div></div>`,
    n: N(['A leitura remota da C25: o Mac lê o núcleo de lá pela porta do túnel.'], ['Quem libera ações é a Workstation, no config dela: o túnel faz o pedido do Mac parecer local lá, então o padrão é recusar.', 'Rodar lá é o núcleo de lá, com o catálogo de lá. O Mac só repassa o id do item e da ação.', 'No Linux o apt pede sudo: a maior parte das CLIs de lá fica em Precisa de sudo, mesmo com ações ligadas.']) },
  { id: 'console-tools-containers', cod: 'C76', nome: 'Ferramentas · containers', sub: 'O card Containers em cada plataforma: Colima rodando (1), parado, com Iniciar (2), iniciando (3), nenhum runtime, com a proposta de instalar o Colima (4), Docker Engine parado no Linux, que pede sudo (5) e Windows, com o Podman Desktop como a proposta de código aberto (6). Em 1100.', html: () => `<div class="fila">${frameAt(1100, 'tools', toolsContainersScreen())}</div>`,
    n: N(['Os números de Docker da C25 (Workstation): containers e disco.'], ['Aqui só a saúde do runtime e Iniciar / Parar. Uso por imagem, volumes e stacks com a sessão dona ficam na tela da máquina.', 'Docker Desktop achado é lido, nunca iniciado nem atualizado pelo console.', 'Windows é proposta: o Podman Desktop, com o WSL 2; ligar o WSL pede administrador.']) },
]

// =====================================================================
// Montagem
// =====================================================================
function montar() {
  const main = document.getElementById('telas'), indice = document.getElementById('indice')
  let htmlI = '', htmlM = ''
  for (const t of TELAS) {
    if (t.cap) { htmlI += `<h3>${t.titulo}</h3>`; htmlM += `<div class="capitulo" id="cap-${t.cap}"><h2>${t.titulo}</h2><p>${t.desc}</p></div>`; continue }
    htmlI += `<a href="#${t.id}"><span>${t.cod}</span>${t.nome}</a>`
    htmlM += `<section class="tela" id="${t.id}"><div class="olho">${t.cod}</div><h3>${t.nome}</h3><p>${t.sub}</p><div class="palco">${t.html()}</div>${t.n}</section>`
  }
  htmlI += `<h3>Fechamento</h3><a href="#perguntas"><span>✓</span>Decisões e o que falta</a>`
  htmlM += `<section class="tela perguntas" id="perguntas"><div class="capitulo"><h2>Decisões do dono e o que falta</h2></div><ol>
    <li><b>Motivo de uma pergunta:</b> fica "Pede permissão" (<code>notification</code>), com o tipo dito na faixa.</li>
    <li><b>Clique numa sessão na bandeja:</b> abre na janela do app. Abrir no Claude Desktop é sempre explícito: item alternativo com ⌥ no menu, ação própria na notificação e botão no detalhe (A2, A3, A5).</li>
    <li><b>Barra de contexto:</b> laranja até 79%, vermelha a partir de 80%.</li>
    <li><b>A espera virou dois estados (#245, a aprovar):</b> <b>Precisa de você</b> é o que trava a sessão até você agir (Pede permissão, Pergunta, Plano para aprovar, Decisão pedida, Com erro), em amarelo, com destaque e sempre com o motivo. <b>Ociosa</b> é a sua vez no bate-bola (Sua vez, Interrompida, No prompt), em cor neutra, sem destaque e com o motivo em chip leve. O número da bandeja, o inbox do Dashboard e as notificações contam só "Precisa de você".</li>
    <li><b>Notificação:</b> só quando a sessão passa a precisar de você ou para com erro, todas com som. Ociosa não notifica (#245).</li>
