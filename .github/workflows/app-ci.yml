# CI do app desktop (apps/desktop): testes e clippy do Rust e uma build de debug do .app, para
# saber num PR que o app ainda compila e empacota. A release é o app-release.yml.

name: app-ci

on:
  pull_request:
    paths:
      - apps/desktop/**
      - packages/nucleo/**
      - packages/marca/**
      - .github/workflows/app-ci.yml
      - docs/integrations/codex-sessions.md
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - packages/nucleo/**
      - packages/marca/**
      - .github/workflows/app-ci.yml
      - docs/integrations/codex-sessions.md

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Testes
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Os recursos do bundle (packages/nucleo e packages/marca/gerado) já estão no repositório.
      - name: Build de debug do .app
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --debug --bundles app

      - name: Package QA application
        working-directory: .
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(uname -m)" = arm64
          APP="apps/desktop/src-tauri/target/debug/bundle/macos/Ahrena Console.app"
          test -d "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/ahrena-console-desktop")" = arm64
          mkdir -p qa-artifact
          COPYFILE_DISABLE=1 tar -czf qa-artifact/ahrena-console-qa-arm64.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          archive = Path("qa-artifact/ahrena-console-qa-arm64.tar.gz")
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          manifest = {"source_sha": os.environ["SOURCE_SHA"], "architecture": "arm64", "run_url": os.environ["RUN_URL"], "archive": archive.name, "sha256": checksum, "signing": "ad-hoc", "notarized": False, "purpose": "human QA only"}
          Path("qa-artifact/manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          Path("qa-artifact/SHA256SUMS").write_text(f"{checksum}  {archive.name}\n")
          PYTHON

      - name: Upload QA application (one day)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ahrena-console-qa-${{ github.event.pull_request.head.sha || github.sha }}-arm64
          path: qa-artifact/
          retention-days: 1
          if-no-files-found: error
