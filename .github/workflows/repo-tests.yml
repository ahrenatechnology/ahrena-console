# Repository-wide tests: the root guard (brand tokens, internals in English, decision 0009) and the
# whole core suite in packages/nucleo/test, sharded.

name: repo-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repo-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tests
        run: node --test 'test/*.test.mjs'

  # The whole core suite on every PR, split into shards so each job stays short. The proof that a
  # PR passes the core is this CI, not a local run (#395): locally, run only the touched file with
  # --test-concurrency=1.
  nucleo:
    name: nucleo (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install core test dependencies
        working-directory: packages/nucleo
        run: npm ci --ignore-scripts

      - name: Core tests
        working-directory: packages/nucleo
        run: node --test --test-concurrency=2 --disable-warning=ExperimentalWarning --test-shard=${{ matrix.shard }}/6 "test/**/*.test.ts"
