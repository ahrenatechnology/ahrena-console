# Repository-wide tests: the root guard (brand tokens, internals in English, decision 0009) and the
# whole core suite, sharded: packages/nucleo/test plus the unit tests beside their code in
# packages/nucleo/src (#660).

name: repo-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repo-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tests
        run: node --test 'test/*.test.mjs'

  # The whole core suite on every PR, split into shards so each job stays short. It is one node
  # --test run over both globs (test/ and the colocated src/**/*.test.ts), so sharding splits the
  # whole set (#660). The proof that a PR passes the core is this CI, not a local run (#395):
  # locally, run only the touched file with --test-concurrency=1.
  nucleo:
    name: nucleo (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install core test dependencies
        working-directory: packages/nucleo
        run: npm ci --ignore-scripts

      - name: Core tests
        working-directory: packages/nucleo
        run: >
          node --test --test-concurrency=2 --disable-warning=ExperimentalWarning
          --experimental-test-coverage
          --test-coverage-include="src/**/*.ts"
          --test-coverage-exclude="src/**/*.test.ts"
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=coverage-shard-${{ matrix.shard }}.lcov
          --test-shard=${{ matrix.shard }}/6
          "test/**/*.test.ts" "src/**/*.test.ts"

      # The shard's lcov feeds the coverage job below (#659).
      - name: Upload shard coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: packages/nucleo/coverage-shard-${{ matrix.shard }}.lcov
          if-no-files-found: error

  # Sums the six shard reports and publishes line coverage of the diff, the total and each layer of
  # docs/architecture/layers.json, as the job summary and the coverage-report artifact (#659). It
  # only publishes: the scorecard check applies the limits (#666).
  coverage:
    name: coverage
    needs: nucleo
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download shard coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*
          path: shard-coverage

      - name: Sum and report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base_args=()
          if [ -n "${BASE_SHA:-}" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            base_args=(--base "$BASE_SHA")
          fi
          node scripts/coverage-report.mjs --lcov shard-coverage --out coverage-report "${base_args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage-report
