<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ahrena Console</title>
  <link rel="stylesheet" href="/ui/brand.css">
  <link rel="stylesheet" href="/ui/shell.css">
  <link rel="stylesheet" href="/ui/open-action.css">
  <script type="module" src="/ui/app.js"></script>
</head>
<body>
  <div class="cc">
    <aside class="cc-side">
      <a class="cc-brand" href="/ui">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect class="logo-bg" width="32" height="32" rx="8"/>
          <path class="logo-a" d="M9 23 L16 8 L23 23"/>
          <path class="logo-tip" d="M13 16.5 L19 16.5 L16 21.5 Z"/>
        </svg>
        <div><b>Ahrena Console</b><small>Claude · Codex</small></div>
      </a>
      <nav id="nav" aria-label="Telas"></nav>
      <div class="cc-foot">
        <div class="card" id="live" data-state="connecting" aria-live="polite"></div>
        <div class="card" title="O núcleo que serve esta página">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>
          <span class="mono" id="port"></span>
        </div>
      </div>
    </aside>
    <main class="cc-main" id="content"></main>
  </div>
</body>
</html>
